[package]
name = "zeta-benchmarks"
version = "0.0.0"
publish = false
edition.workspace = true
description = "Gungraun benchmarks for the zeta workspace."
license.workspace = true

[dependencies]
chrono = { workspace = true }
irc.workspace = true
time = { workspace = true }
tokio.workspace = true
tracing.workspace = true
zeta-plugin = { workspace = true, default-features = false }
zeta-plugin-runtime = { workspace = true }
zeta-test-support = { workspace = true, default-features = false, features = [
    "context",
] }
zeta-utils = { workspace = true, features = ["chrono", "time"] }

[dev-dependencies]
gungraun = { workspace = true }

[[bench]]
name = "join"
harness = false

[[bench]]
name = "duration"
harness = false

[[bench]]
name = "dispatch"
harness = false

[[bench]]
name = "dispatch_telemetry"
harness = false

[lints]
workspace = true

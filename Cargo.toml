[workspace]
resolver = "3"
members = ["benchmarks", "crates/*", "xtask"]
# `cargo run`, `build`, `test` and `check` without a selection flag operate on the bot.
default-members = ["crates/zeta"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mkroman/zeta"
rust-version = "1.100"

[workspace.dependencies]
arc-swap = "1.9"
bytes = "1.12.1"
chrono = { version = "0.4.45" }
clap = { version = "4.6.7", features = ["derive"] }
figment = { version = "0.10.19", features = ["toml", "env"] }
foldhash = "0.2"
gungraun = "0.20.0"
hickory-resolver = { version = "0.26.2", features = ["tls-aws-lc-rs"] }
humantime-serde = "1.1.1"
irc = { version = "1.1.0", default-features = false, features = ["serde", "tls-rust"] }
miette = { version = "7.2.0", default-features = false, features = ["derive", "fancy-no-backtrace"] }
parking_lot = "0.13"
plugins-shared = { path = "crates/plugins-shared" }
proc-macro2 = "1"
quote = "1"
reqwest = { version = "0.13.1", default-features = false, features = ["charset", "http2", "system-proxy", "json", "query"] }
scraper = "0.29.0"
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.215", features = ["derive"] }
serde_ignored = "0.1.14"
serde_json = "1.0.149"
serde_path_to_error = "0.1.17"
sha2 = "0.11"
shlex = "2.0.0"
smallvec = "1.16.4"
tempfile = "3.23.0"
thiserror = "2.0"
time = { version = "0.3.43", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1.52.3", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "fs",
    "process",
    "io-util",
    "net",
    "signal",
] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
trybuild = "1.0"
url = "2.5.8"
wildmatch = "=2.7.0"
zeta-cache = { path = "crates/zeta-cache" }
zeta-http = { path = "crates/zeta-http" }
zeta-mirror = { path = "crates/zeta-mirror" }
zeta-plugin = { path = "crates/zeta-plugin" }
zeta-plugin-macros = { path = "crates/zeta-plugin-macros" }
zeta-plugin-runtime = { path = "crates/zeta-plugin-runtime" }
zeta-test-support = { path = "crates/zeta-test-support" }
zeta-unicode = { path = "crates/zeta-unicode" }
zeta-unicode-build = { path = "crates/zeta-unicode-build", version = "0.0.0" }
zeta-unicode-format = { path = "crates/zeta-unicode-format", version = "0.0.0" }
zeta-url = { path = "crates/zeta-url" }
zeta-utils = { path = "crates/zeta-utils" }

[workspace.lints.clippy]
# Enable all basic clippy lints. The groups run at a higher priority than the individually
# named lints below, per clippy's lint_groups_priority.
all = { level = "warn", priority = 1 }
# Enable pedantic lints for stricter code quality
pedantic = { level = "warn", priority = 1 }
# Enable experimental/unstable lints that may have false positives
nursery = { level = "warn", priority = 1 }
# Disable cargo-related lints (often too noisy for dependencies)
cargo = "allow"
# Allow for higher complexity since it's not a reliable estimate
cognitive_complexity = "allow"

[workspace.lints.rust]
# Completely disallow unsafe code - no unsafe blocks, functions, or traits
unsafe_code = "forbid"
# Require documentation for public items
missing_docs = "warn"
# Enforce modern Rust 2018+ idioms and patterns
rust_2018_idioms = { level = "warn", priority = 1 }
# Catch unnecessary casts between identical types
trivial_casts = "warn"
# Catch unnecessary numeric type casts (e.g. u32 as u32)
trivial_numeric_casts = "warn"
# Warn when import braces are used unnecessarily (use foo::{bar} vs use foo::bar)
unused_import_braces = "warn"
# Catch redundant path qualifications (self::foo when foo would suffice)
unused_qualifications = "warn"

[profile.release]
lto = true
strip = "debuginfo"
panic = "unwind"
opt-level = 3
codegen-units = 1

# Gungraun needs debug symbols to find the benchmark entry point (and the `bench` profile
# inherits `release`, including its stripping).
[profile.bench]
debug = true
strip = false

# The xtask is a developer tool built on demand by `cargo xtask`. Dependency debug info is
# unnecessary and dominates its cold build time; the profile still inherits dev otherwise.
[profile.xtask]
inherits = "dev"
debug = false
# CI only reuses the finished binary between steps, so incremental state adds a large
# target-dir footprint without helping a cold build.
incremental = false

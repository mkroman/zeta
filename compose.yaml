services:
  ircd:
    image: inspircd/inspircd-docker:4
    ports:
    - '6667:6667'
    environment:
    - INSP_ENABLE_DNSBL=no
    volumes:
    # Relaxes clone limits, fake lag, and connection throttling that would otherwise get in the
    # way of running the bot and test clients against the local server. Included through the
    # image's /inspircd/conf.d/ mechanism; restart the container after changing it:
    # `docker compose restart ircd`.
    - ./hack/inspircd/testing.conf:/inspircd/conf.d/testing.conf:ro

  jaeger:
    image: jaegertracing/jaeger:2.21.0@sha256:3d0ac795ff98aa04d1be04311d2dac6c25b4bfc8322dc02e53bc5b170c5018c3
    ports:
    - '6831:6831/udp'
    - '6832:6832/udp'
    - '4317:4317'
    - '4318:4318'
    - '16686:16686'
    - '14268:14268'
    command:
    - --set
    - receivers.otlp.protocols.http.endpoint=0.0.0.0:4318
    - --set
    - receivers.otlp.protocols.grpc.endpoint=0.0.0.0:4317

  postgres:
    image: 'postgres:18'
    ports:
    - '5432:5432'
    restart: always
    environment:
    - POSTGRES_USER=user
    - POSTGRES_PASSWORD=changeme
    - POSTGRES_DB=zeta_development
    - POSTGRES_HOST_AUTH_METHOD=trust
    volumes:
    - postgres_data:/var/lib/postgresql

  # S3-compatible endpoint for testing media mirroring; started with
  # `docker compose --profile mirror up -d`. Docker Hub is unreachable from some environments —
  # the images come from quay.io.
  minio:
    image: quay.io/minio/minio:latest
    profiles:
    - mirror
    ports:
    - '9000:9000'
    - '9001:9001'
    restart: always
    environment:
    - MINIO_ROOT_USER=zeta
    - MINIO_ROOT_PASSWORD=changeme
    command: server /data --console-address ':9001'
    volumes:
    - minio_data:/data

  # One-shot bucket creation for the minio service.
  minio-init:
    image: quay.io/minio/mc:latest
    profiles:
    - mirror
    depends_on:
    - minio
    entrypoint: /bin/sh
    # Retries the alias until MinIO is listening; `mc ready` would need the alias first.
    command:
    - -c
    - |
      until mc alias set local http://minio:9000 zeta changeme >/dev/null 2>&1; do sleep 1; done
      mc mb --ignore-existing local/zeta-mirror


volumes:
  postgres_data:
  minio_data:

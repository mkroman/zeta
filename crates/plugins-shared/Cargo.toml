[package]
name = "plugins-shared"
version = "0.0.0"
rust-version.workspace = true
edition.workspace = true
description = "Code shared by several bundled plugins for the zeta IRC bot."
license.workspace = true
repository.workspace = true

[features]
default = []
# The reply flow, mirror settings and mirror handle shared by the plugins that mirror media.
mirror = ["dep:serde", "dep:zeta-mirror", "dep:zeta-plugin"]

[dependencies]
irc.workspace = true
serde = { workspace = true, optional = true }
tokio.workspace = true
tracing.workspace = true
url.workspace = true
zeta-mirror = { path = "../zeta-mirror", optional = true }
zeta-plugin = { path = "../zeta-plugin", default-features = false, optional = true }
zeta-url = { path = "../zeta-url" }

[dev-dependencies]
zeta-test-support = { path = "../zeta-test-support", default-features = false }

[lints]
workspace = true

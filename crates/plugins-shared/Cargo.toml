[package]
name = "plugins-shared"
version = "0.0.0"
edition = "2024"
description = "Code shared by several bundled plugins for the zeta IRC bot."
license = "MIT OR Apache-2.0"
repository = "https://github.com/mkroman/zeta"

[features]
default = []
# The reply flow shared by the plugins that mirror media.
mirror = ["dep:zeta-mirror", "dep:irc", "dep:tracing", "dep:zeta-plugin"]

[dependencies]
irc = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
url.workspace = true
zeta-mirror = { path = "../zeta-mirror", optional = true }
zeta-plugin = { path = "../zeta-plugin", default-features = false, optional = true }
zeta-url = { path = "../zeta-url" }

[dev-dependencies]
zeta-test-support = { path = "../zeta-test-support", default-features = false }

[lints]
workspace = true

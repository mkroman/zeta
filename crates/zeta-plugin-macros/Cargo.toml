[package]
name = "zeta-plugin-macros"
version = "0.0.0"
rust-version.workspace = true
edition.workspace = true
description = "The `#[plugin]` attribute macro for the zeta plugin API."
license.workspace = true
repository.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2.workspace = true
quote.workspace = true
syn = { version = "3", default-features = false, features = [
    "clone-impls",
    "derive",
    "full",
    "parsing",
    "printing",
    "proc-macro",
] }

[dev-dependencies]
clap.workspace = true
irc.workspace = true
tokio.workspace = true
trybuild.workspace = true
zeta-plugin = { path = "../zeta-plugin", default-features = false }
zeta-test-support = { path = "../zeta-test-support", default-features = false, features = ["context"] }

[lints]
workspace = true

[package]
name = "zeta-plugin-macros"
version = "0.0.0"
edition = "2024"
description = "The `#[plugin]` attribute macro for the zeta plugin API."
license = "MIT OR Apache-2.0"
repository = "https://github.com/mkroman/zeta"

[lib]
proc-macro = true

[dependencies]
proc-macro2.workspace = true
quote.workspace = true
syn = { version = "3", default-features = false, features = [
    "clone-impls",
    "derive",
    "full",
    "parsing",
    "printing",
    "proc-macro",
] }

[dev-dependencies]
clap.workspace = true
zeta-plugin = { path = "../zeta-plugin", default-features = false }

[lints]
workspace = true

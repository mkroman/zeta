[package]
name = "plugins-filter"
version = "0.0.0"
rust-version.workspace = true
edition.workspace = true
description = "The filter plugin for the zeta IRC bot."
license.workspace = true
repository.workspace = true

[features]
default = []

[dependencies]
arc-swap.workspace = true
clap.workspace = true
foldhash.workspace = true
sqlx = { version = "0.9.0", default-features = false, features = ["migrate", "macros", "postgres", "chrono", "runtime-tokio"] }
thiserror.workspace = true
tracing.workspace = true
url.workspace = true
wildmatch.workspace = true
zeta-plugin = { workspace = true, default-features = false, features = ["database"] }
zeta-url = { workspace = true }
zeta-utils = { workspace = true }

[dev-dependencies]
allocation-counter = "=0.8.1"
tokio = { workspace = true, features = ["test-util"] }
zeta-test-support = { workspace = true }

[lints]
workspace = true

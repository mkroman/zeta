[package]
name = "plugins-gay"
version = "0.0.0"
rust-version.workspace = true
edition.workspace = true
description = "The gay plugin for the zeta IRC bot."
license.workspace = true
repository.workspace = true

[package.metadata.cargo-machete]
# The irc dependency only unifies the `channel-lists` feature used by `Client::list_users`.
ignored = ["irc"]

[features]
default = []

[dependencies]
chrono.workspace = true
clap.workspace = true
irc = { workspace = true, features = ["channel-lists"] }
miette.workspace = true
rand_mt = "6"
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
zeta-plugin = { workspace = true, default-features = false }

[lints]
workspace = true

[package]
name = "plugins-unwall"
version = "0.0.0"
edition = "2024"
description = "The unwall plugin for the zeta IRC bot."
license = "MIT OR Apache-2.0"
repository = "https://github.com/mkroman/zeta"

[package.metadata.cargo-machete]
# `humantime-serde` is only named from `#[serde(with = "...")]` attributes.
ignored = ["humantime-serde"]

[features]
default = []
rustls = ["zeta-plugin/rustls", "reqwest/rustls", "zeta-http/rustls"]
native-tls = ["zeta-plugin/native-tls", "reqwest/native-tls", "zeta-http/native-tls"]
native-tls-vendored = [
    "zeta-plugin/native-tls-vendored",
    "reqwest/native-tls-vendored",
    "zeta-http/native-tls-vendored",
]

[dependencies]
arc-swap.workspace = true
argh.workspace = true
humantime-serde.workspace = true
reqwest = { workspace = true, features = ["json", "cookies", "form", "query", "gzip", "brotli", "deflate", "zstd"] }
serde.workspace = true
sqlx = { version = "0.9.0", default-features = false, features = ["migrate", "macros", "postgres", "chrono", "runtime-tokio"] }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true
zeta-cache = { path = "../zeta-cache" }
zeta-http = { path = "../zeta-http", default-features = false, features = ["http"] }
zeta-plugin = { path = "../zeta-plugin", default-features = false, features = ["database"] }
zeta-url = { path = "../zeta-url" }
zeta-utils = { path = "../zeta-utils", features = ["chrono"] }

[dev-dependencies]
serde_json.workspace = true
zeta-test-support = { path = "../zeta-test-support" }

[lints]
workspace = true

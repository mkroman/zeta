[package]
name = "plugins-unwall"
version = "0.0.0"
rust-version.workspace = true
edition.workspace = true
description = "The unwall plugin for the zeta IRC bot."
license.workspace = true
repository.workspace = true

[package.metadata.cargo-machete]
# `humantime-serde` is only named from `#[serde(with = "...")]` attributes.
ignored = ["humantime-serde"]

[features]
default = []

[dependencies]
arc-swap.workspace = true
clap.workspace = true
humantime-serde.workspace = true
plugins-shared = { workspace = true }
serde.workspace = true
sqlx = { version = "0.9.0", default-features = false, features = ["migrate", "macros", "postgres", "chrono", "runtime-tokio"] }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true
zeta-cache = { workspace = true }
zeta-http = { workspace = true, default-features = false, features = ["http"] }
zeta-plugin = { workspace = true, default-features = false, features = ["database", "http"] }
zeta-url = { workspace = true }
zeta-utils = { workspace = true, features = ["chrono"] }

[dev-dependencies]
zeta-test-support = { workspace = true }

[lints]
workspace = true

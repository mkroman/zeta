[package]
name = "plugins-rink"
version = "0.0.0"
rust-version.workspace = true
edition.workspace = true
description = "The rink plugin for the zeta IRC bot."
license.workspace = true
repository.workspace = true

[package.metadata.cargo-machete]
# `humantime-serde` is only named from `#[serde(with = "...")]` attributes.
ignored = ["humantime-serde"]

[features]
default = []
rustls = ["zeta-plugin/rustls", "reqwest/rustls", "zeta-http/rustls"]
native-tls = ["zeta-plugin/native-tls", "reqwest/native-tls", "zeta-http/native-tls"]
native-tls-vendored = [
    "zeta-plugin/native-tls-vendored",
    "reqwest/native-tls-vendored",
    "zeta-http/native-tls-vendored",
]

[dependencies]
humantime-serde.workspace = true
plugins-shared = { path = "../plugins-shared" }
reqwest = { workspace = true, features = ["json", "cookies", "form", "query", "gzip", "brotli", "deflate", "zstd"] }
rink-core = { git = "https://codeberg.org/tiffany/rink", rev = "61be392a0d605ea6c4192934134683d63fbe7f7d", features = ["bundle-files", "serde_json"] }
serde.workspace = true
tokio.workspace = true
tracing.workspace = true
zeta-cache = { path = "../zeta-cache" }
zeta-http = { path = "../zeta-http", default-features = false, features = ["http"] }
zeta-plugin = { path = "../zeta-plugin", default-features = false, features = ["http"] }
zeta-utils = { path = "../zeta-utils" }

[dev-dependencies]
zeta-test-support = { path = "../zeta-test-support" }

[lints]
workspace = true

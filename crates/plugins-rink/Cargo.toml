[package]
name = "plugins-rink"
version = "0.0.0"
edition = "2024"
description = "The rink plugin for the zeta IRC bot."
license = "MIT OR Apache-2.0"
repository = "https://github.com/mkroman/zeta"

[package.metadata.cargo-machete]
# `humantime-serde` is only named from `#[serde(with = "...")]` attributes.
ignored = ["humantime-serde"]

[features]
default = []
rustls = [
    "zeta-plugin/rustls",
    "reqwest/rustls",
    "coinmarketcap/rustls",
    "zeta-http/rustls",
]
native-tls = [
    "zeta-plugin/native-tls",
    "reqwest/native-tls",
    "coinmarketcap/native-tls",
    "zeta-http/native-tls",
]
native-tls-vendored = [
    "zeta-plugin/native-tls-vendored",
    "reqwest/native-tls-vendored",
    "coinmarketcap/native-tls-vendored",
    "zeta-http/native-tls-vendored",
]

[dependencies]
coinmarketcap = { path = "../coinmarketcap", default-features = false }
humantime-serde.workspace = true
reqwest = { workspace = true, features = ["json", "cookies", "form", "query", "gzip", "brotli", "deflate", "zstd"] }
rink-core = { git = "https://codeberg.org/tiffany/rink", rev = "61be392a0d605ea6c4192934134683d63fbe7f7d", features = ["bundle-files", "serde_json"] }
serde.workspace = true
tokio.workspace = true
tracing.workspace = true
zeta-cache = { path = "../zeta-cache" }
zeta-http = { path = "../zeta-http", default-features = false, features = ["http"] }
zeta-plugin = { path = "../zeta-plugin", default-features = false }
zeta-utils = { path = "../zeta-utils" }

[dev-dependencies]
serde_json.workspace = true
zeta-test-support = { path = "../zeta-test-support" }

[lints]
workspace = true

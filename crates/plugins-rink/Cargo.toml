[package]
name = "plugins-rink"
version = "0.0.0"
rust-version.workspace = true
edition.workspace = true
description = "The rink plugin for the zeta IRC bot."
license.workspace = true
repository.workspace = true

[package.metadata.cargo-machete]
# `humantime-serde` is only named from `#[serde(with = "...")]` attributes.
ignored = ["humantime-serde"]

[features]
default = []
rustls = ["coinmarketcap/rustls"]
native-tls = ["coinmarketcap/native-tls"]
native-tls-vendored = ["coinmarketcap/native-tls-vendored"]

[dependencies]
coinmarketcap = { path = "../coinmarketcap", default-features = false }
humantime-serde.workspace = true
rink-core = { git = "https://codeberg.org/tiffany/rink", rev = "61be392a0d605ea6c4192934134683d63fbe7f7d", features = ["bundle-files", "serde_json"] }
serde.workspace = true
tokio.workspace = true
tracing.workspace = true
zeta-cache = { workspace = true }
zeta-http = { workspace = true, default-features = false, features = ["http"] }
zeta-plugin = { workspace = true, default-features = false, features = ["http"] }
zeta-utils = { workspace = true }

[dev-dependencies]
zeta-test-support = { workspace = true }

[lints]
workspace = true

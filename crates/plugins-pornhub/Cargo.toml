[package]
name = "plugins-pornhub"
version = "0.0.0"
rust-version.workspace = true
edition.workspace = true
description = "The pornhub plugin for the zeta IRC bot."
license.workspace = true
repository.workspace = true

[features]
default = []
rustls = ["zeta-plugin/rustls", "reqwest/rustls", "zeta-http/rustls"]
native-tls = ["zeta-plugin/native-tls", "reqwest/native-tls", "zeta-http/native-tls"]
native-tls-vendored = [
    "zeta-plugin/native-tls-vendored",
    "reqwest/native-tls-vendored",
    "zeta-http/native-tls-vendored",
]

[dependencies]
num-format = "0.4.4"
reqwest = { workspace = true, features = ["json", "cookies", "form", "query", "gzip", "brotli", "deflate", "zstd"] }
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
url.workspace = true
zeta-http = { path = "../zeta-http", default-features = false, features = ["http"] }
zeta-plugin = { path = "../zeta-plugin", default-features = false, features = ["http"] }
zeta-url = { path = "../zeta-url" }
zeta-utils = { path = "../zeta-utils" }

[lints]
workspace = true

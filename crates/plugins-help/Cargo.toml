[package]
name = "plugins-help"
version = "0.0.0"
edition = "2024"
description = "The help plugin for the zeta IRC bot."
license = "MIT OR Apache-2.0"
repository = "https://github.com/mkroman/zeta"

[features]
default = []
rustls = ["zeta-plugin/rustls"]
native-tls = ["zeta-plugin/native-tls"]
native-tls-vendored = ["zeta-plugin/native-tls-vendored"]

[dependencies]
argh.workspace = true
zeta-plugin = { path = "../zeta-plugin", default-features = false }
zeta-utils = { path = "../zeta-utils" }

[lints]
workspace = true

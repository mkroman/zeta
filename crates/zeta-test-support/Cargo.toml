[package]
name = "zeta-test-support"
version = "0.0.0"
edition = "2024"
description = "Shared test utilities for the zeta workspace crates."
license = "MIT OR Apache-2.0"
repository = "https://github.com/mkroman/zeta"

[dependencies]
reqwest.workspace = true
# The test context carries an unreachable (lazily connected) database pool; the plugin
# interface is needed to construct the context at all.
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio"] }
url.workspace = true
wiremock = "0.6"
zeta-plugin = { path = "../zeta-plugin", features = ["database"] }

[dev-dependencies]
tokio.workspace = true

[lints]
workspace = true

[package]
name = "zeta-test-support"
version = "0.0.0"
edition = "2024"
description = "Shared test utilities for the zeta workspace crates."
license = "MIT OR Apache-2.0"
repository = "https://github.com/mkroman/zeta"

[features]
default = ["context", "http"]
# The plugin context helper, with an unreachable (lazily connected) database pool, and the
# mock IRC client.
context = ["dep:irc", "dep:sqlx", "dep:zeta-plugin", "zeta-plugin/database"]
# The HTTP transport helpers: connection-refused, timeout, and 404 servers.
http = ["dep:reqwest", "dep:wiremock"]

[dependencies]
irc = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
serde_json.workspace = true
# The test context carries an unreachable (lazily connected) database pool; the plugin
# interface is needed to construct the context at all.
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio"], optional = true }
url.workspace = true
wiremock = { version = "0.6", optional = true }
zeta-plugin = { path = "../zeta-plugin", default-features = false, optional = true }

[dev-dependencies]
tokio.workspace = true

[lints]
workspace = true

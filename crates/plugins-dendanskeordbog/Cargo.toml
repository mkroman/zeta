[package]
name = "plugins-dendanskeordbog"
version = "0.0.0"
rust-version.workspace = true
edition.workspace = true
description = "The dendanskeordbog plugin for the zeta IRC bot."
license.workspace = true
repository.workspace = true

[features]
default = []
rustls = ["dendanskeordbog/rustls"]
native-tls = ["dendanskeordbog/native-tls"]
native-tls-vendored = ["dendanskeordbog/native-tls-vendored"]

[dependencies]
dendanskeordbog = { path = "../dendanskeordbog", features = ["client", "log"] }
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
zeta-plugin = { workspace = true, default-features = false, features = ["http"] }

[dev-dependencies]
zeta-test-support = { workspace = true }

[lints]
workspace = true

[package]
name = "plugins-dendanskeordbog"
version = "0.0.0"
rust-version.workspace = true
edition.workspace = true
description = "The dendanskeordbog plugin for the zeta IRC bot."
license.workspace = true
repository.workspace = true

[features]
default = []
rustls = ["zeta-plugin/rustls", "dendanskeordbog/rustls"]
native-tls = ["zeta-plugin/native-tls", "dendanskeordbog/native-tls"]
native-tls-vendored = ["zeta-plugin/native-tls-vendored", "dendanskeordbog/native-tls-vendored"]

[dependencies]
dendanskeordbog = { path = "../dendanskeordbog", features = ["client", "log"] }
serde.workspace = true
tracing.workspace = true
zeta-plugin = { path = "../zeta-plugin", default-features = false, features = ["http"] }

[dev-dependencies]
zeta-test-support = { path = "../zeta-test-support" }

[lints]
workspace = true

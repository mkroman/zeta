[package]
name = "zeta-mirror"
version = "0.0.0"
rust-version.workspace = true
edition.workspace = true
description = "Media mirroring for the zeta IRC bot: yt-dlp downloads uploaded to S3."
license.workspace = true
repository.workspace = true

[package.metadata.cargo-machete]
ignored = ["humantime-serde"]

[dependencies]
aws-credential-types = { workspace = true }
aws-sigv4 = { workspace = true }
aws-smithy-runtime-api = { workspace = true, features = ["client"] }
const-hex = { workspace = true }
futures = { workspace = true }
humantime-serde.workspace = true
parking_lot.workspace = true
reqwest = { workspace = true, features = ["stream", "json", "cookies", "form", "query", "gzip", "brotli", "deflate", "zstd"] }
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true
zeta-http = { workspace = true, features = ["request"] }
zeta-url = { workspace = true }
zeta-utils = { workspace = true }

[dev-dependencies]
allocation-counter = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
zeta-test-support = { workspace = true, features = ["http"] }

[lints]
workspace = true

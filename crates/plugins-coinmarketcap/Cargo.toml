[package]
name = "plugins-coinmarketcap"
version = "0.0.0"
rust-version.workspace = true
edition.workspace = true
description = "The coinmarketcap plugin for the zeta IRC bot."
license.workspace = true
repository.workspace = true

[package.metadata.cargo-machete]
# `humantime-serde` is only named from `#[serde(with = "...")]` attributes.
ignored = ["humantime-serde"]

[features]
default = []
rustls = ["coinmarketcap/rustls"]
native-tls = ["coinmarketcap/native-tls"]
native-tls-vendored = ["coinmarketcap/native-tls-vendored"]

[dependencies]
clap.workspace = true
coinmarketcap = { path = "../coinmarketcap", default-features = false }
humantime-serde.workspace = true
serde.workspace = true
strsim = "0.11"
tokio.workspace = true
tracing.workspace = true
zeta-cache = { workspace = true }
zeta-plugin = { workspace = true, default-features = false, features = ["http"] }
zeta-utils = { workspace = true }

[dev-dependencies]
zeta-test-support = { workspace = true }

[lints]
workspace = true

[package]
name = "plugins-coinmarketcap"
version = "0.0.0"
rust-version.workspace = true
edition.workspace = true
description = "The coinmarketcap plugin for the zeta IRC bot."
license.workspace = true
repository.workspace = true

[package.metadata.cargo-machete]
# `humantime-serde` is only named from `#[serde(with = "...")]` attributes.
ignored = ["humantime-serde"]

[features]
default = []
rustls = ["zeta-plugin/rustls", "coinmarketcap/rustls"]
native-tls = ["zeta-plugin/native-tls", "coinmarketcap/native-tls"]
native-tls-vendored = ["zeta-plugin/native-tls-vendored", "coinmarketcap/native-tls-vendored"]

[dependencies]
clap.workspace = true
coinmarketcap = { path = "../coinmarketcap", default-features = false }
humantime-serde.workspace = true
plugins-shared = { path = "../plugins-shared" }
serde.workspace = true
strsim = "0.11"
tokio.workspace = true
tracing.workspace = true
zeta-cache = { path = "../zeta-cache" }
zeta-plugin = { path = "../zeta-plugin", default-features = false, features = ["http"] }
zeta-utils = { path = "../zeta-utils" }

[dev-dependencies]
zeta-test-support = { path = "../zeta-test-support" }

[lints]
workspace = true

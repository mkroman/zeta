[package]
name = "plugins-alert"
version = "0.0.0"
edition = "2024"
description = "The alert plugin for the zeta IRC bot."
license = "MIT OR Apache-2.0"
repository = "https://github.com/mkroman/zeta"

[package.metadata.cargo-machete]
# `humantime-serde` is only named from `#[serde(with = "...")]` attributes.
ignored = ["humantime-serde"]

[features]
default = []
rustls = ["zeta-plugin/rustls"]
native-tls = ["zeta-plugin/native-tls"]
native-tls-vendored = ["zeta-plugin/native-tls-vendored"]

[dependencies]
argh.workspace = true
chrono.workspace = true
humantime-serde.workspace = true
interim = { version = "0.2.1", features = ["chrono_0_4"] }
rand = "0.10.1"
serde.workspace = true
sqlx = { version = "0.9.0", default-features = false, features = ["migrate", "macros", "postgres", "chrono", "runtime-tokio"] }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
zeta-plugin = { path = "../zeta-plugin", default-features = false, features = ["database"] }
zeta-utils = { path = "../zeta-utils" }

[dev-dependencies]
serde_json.workspace = true
zeta-test-support = { path = "../zeta-test-support" }

[lints]
workspace = true

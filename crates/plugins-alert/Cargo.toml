[package]
name = "plugins-alert"
version = "0.0.0"
rust-version.workspace = true
edition.workspace = true
description = "The alert plugin for the zeta IRC bot."
license.workspace = true
repository.workspace = true

[package.metadata.cargo-machete]
# `humantime-serde` is only named from `#[serde(with = "...")]` attributes.
ignored = ["humantime-serde"]

[features]
default = []

[dependencies]
chrono.workspace = true
clap.workspace = true
humantime-serde.workspace = true
interim = { version = "0.2.1", features = ["chrono_0_4"] }
parking_lot.workspace = true
rand = "0.10.1"
serde.workspace = true
sqlx = { version = "0.9.0", default-features = false, features = ["migrate", "macros", "postgres", "chrono", "runtime-tokio"] }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
zeta-plugin = { workspace = true, default-features = false, features = ["database"] }
zeta-utils = { workspace = true }

[dev-dependencies]
zeta-test-support = { workspace = true }

[lints]
workspace = true

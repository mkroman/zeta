[package]
name = "zeta"
version = "0.15.0"
rust-version.workspace = true
authors = ["Mikkel Kroman <mk@maero.dk>"]
edition.workspace = true
description = "An opinionated IRC bot with a bunch of plugins."
license.workspace = true
repository.workspace = true

[package.metadata.cargo-machete]
# `zeta-http` is referenced from the feature table only: the crate forwards the TLS and
# transport features its plugins enable, without naming any of its items in the host.
ignored = ["humantime-serde", "zeta-http"]

[lib]
crate-type = ["lib"]

[[bin]]
name = "zeta"
path = "src/main.rs"

[features]
default = ["plugins/all", "rustls", "database", "mirror"]
# Database-backed plugins: the context carries a connection pool, and the host connects to the
# database and applies the plugins' migrations at startup.
database = [
    "dep:sqlx",
    "plugins/database",
    "zeta-plugin/database",
    "zeta-plugin-runtime/database",
]
# Plain reqwest HTTP wrappers (forwarded to zeta-http and the plugin context's shared client).
http = ["zeta-http/http", "zeta-plugin/http"]
# Browser-emulated HTTP client for anti-bot-protected sites, built on wreq.
emulated = ["zeta-http/emulated"]
# Shared media mirroring (S3 upload + yt-dlp download manager); a default so deployments don't silently lose it.
mirror = ["dep:zeta-mirror"]
native-tls = [
    "irc/tls-native",
    "zeta-plugin/native-tls",
    "zeta-http/native-tls",
    "plugins/native-tls",
]
native-tls-vendored = [
    "irc/tls-native",
    "zeta-plugin/native-tls-vendored",
    "zeta-http/native-tls-vendored",
    "plugins/native-tls-vendored",
]
rustls = [
    "dep:rustls",
    "irc/tls-rust",
    "zeta-plugin/rustls",
    "zeta-http/rustls",
    "plugins/rustls",
]

[dependencies]
clap.workspace = true
figment.workspace = true
futures = { workspace = true }
humantime-serde.workspace = true
irc.workspace = true
miette.workspace = true
opentelemetry = { workspace = true, features = ["trace"] }
opentelemetry-otlp = { workspace = true, features = [
    "http-proto",
    "reqwest-client",
    "trace",
] }
opentelemetry-resource-detectors = { workspace = true }
opentelemetry-semantic-conventions = { workspace = true }
opentelemetry_sdk = { workspace = true, features = [
    "experimental_trace_batch_span_processor_with_async_runtime",
    "rt-tokio",
    "trace",
] }
plugins = { workspace = true }
rustls = { workspace = true, optional = true }
secrecy.workspace = true
serde.workspace = true
sqlx = { workspace = true, features = ["migrate", "macros", "chrono"], optional = true }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-opentelemetry = { workspace = true }
tracing-subscriber.workspace = true
url.workspace = true
zeta-http = { workspace = true }
zeta-mirror = { workspace = true, optional = true }
# The host always carries the HTTP configuration in the plugin context, whether or not any
# plugin needs the shared client.
zeta-plugin = { workspace = true, features = ["http"] }
zeta-plugin-runtime = { workspace = true }
zeta-url = { workspace = true }

[dev-dependencies]
# The in-memory exporter pins the `otel.*` contract once, at the export boundary. The exact
# pin is deliberately not inherited from the `0.33.0` workspace requirement.
opentelemetry_sdk = { version = "=0.33.1", default-features = false, features = [
    "testing",
    "trace",
] }
tempfile.workspace = true
zeta-test-support = { workspace = true, features = ["context", "http", "spans"] }

[lints]
workspace = true

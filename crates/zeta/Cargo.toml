[package]
name = "zeta"
version = "0.14.0"
authors = ["Mikkel Kroman <mk@maero.dk>"]
edition = "2024"
description = "An opinionated IRC bot with a bunch of plugins."
license = "MIT OR Apache-2.0"
repository = "https://github.com/mkroman/zeta"

[package.metadata.cargo-machete]
# `zeta-http` is referenced from the feature table only: the crate forwards the TLS and
# transport features its plugins enable, without naming any of its items in the host.
ignored = ["humantime-serde", "zeta-http"]

[lib]
crate-type = ["lib"]

[[bin]]
name = "zeta"
path = "src/main.rs"

[features]
default = ["plugins/all", "rustls", "database", "mirror"]
# Database-backed plugins: the context carries a connection pool, and the host connects to the
# database and applies the plugins' migrations at startup.
database = ["dep:sqlx", "zeta-plugin/database", "zeta-plugin-runtime/database"]
# Plain reqwest HTTP wrappers (forwarded to zeta-http and the plugin context's shared client).
http = ["zeta-http/http", "zeta-plugin/http"]
# Browser-emulated HTTP client for anti-bot-protected sites, built on wreq.
emulated = ["zeta-http/emulated"]
# Shared media mirroring (S3 upload + yt-dlp download manager); a default so deployments don't silently lose it.
mirror = ["dep:zeta-mirror"]
native-tls = [
    "irc/tls-native",
    "zeta-plugin/native-tls",
    "zeta-http/native-tls",
    "plugins/native-tls",
]
native-tls-vendored = [
    "irc/tls-native",
    "zeta-plugin/native-tls-vendored",
    "zeta-http/native-tls-vendored",
    "plugins/native-tls-vendored",
]
rustls = [
    "dep:rustls",
    "irc/tls-rust",
    "zeta-plugin/rustls",
    "zeta-http/rustls",
    "plugins/rustls",
]

[dependencies]
clap.workspace = true
figment.workspace = true
futures = "0.3.31"
humantime-serde.workspace = true
irc.workspace = true
miette = { version = "7.2.0", default-features = false, features = ["derive", "fancy-no-backtrace"] }
opentelemetry = { version = "0.33.0", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.33.0", default-features = false, features = [
    "http-proto",
    "reqwest-client",
    "trace",
] }
opentelemetry-resource-detectors = "0.13.0"
opentelemetry-semantic-conventions = "0.33"
opentelemetry_sdk = { version = "0.33.0", default-features = false, features = [
    "experimental_trace_batch_span_processor_with_async_runtime",
    "rt-tokio",
    "trace",
] }
plugins = { path = "../plugins", default-features = false }
rustls = { version = "0.23.44", optional = true }
secrecy.workspace = true
serde.workspace = true
sqlx = { version = "0.9.0", default-features = false, features = ["migrate", "macros", "postgres", "chrono", "runtime-tokio"], optional = true }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-opentelemetry = { version = "0.34.0", default-features = false }
tracing-subscriber.workspace = true
url.workspace = true
zeta-http = { path = "../zeta-http", default-features = false }
zeta-mirror = { path = "../zeta-mirror", optional = true }
# The host always carries the HTTP configuration in the plugin context, whether or not any
# plugin needs the shared client.
zeta-plugin = { path = "../zeta-plugin", default-features = false, features = ["http"] }
zeta-plugin-runtime = { path = "../zeta-plugin-runtime" }
zeta-url = { path = "../zeta-url" }

[dev-dependencies]
tempfile.workspace = true
zeta-test-support = { path = "../zeta-test-support" }

[lints]
workspace = true

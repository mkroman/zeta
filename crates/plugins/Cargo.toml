[package]
name = "plugins"
version = "0.0.0"
edition = "2024"
description = "The bundled plugins for the zeta IRC bot."
license = "MIT OR Apache-2.0"
repository = "https://github.com/mkroman/zeta"

[package.metadata.docs.rs]
all-features = true

[features]
default = ["all"]
# Shared feature names kept for the host and downstream feature selections. Each plugin crate
# carries its own dependencies, so these mostly preserve the historical feature vocabulary.
# Two historical implications were dropped with the crate split: `ofn` no longer enables
# `youtube` (the URL parser moved to `plugins-shared`) and `unwall` no longer enables `filter`
# (the hostmask matcher moved to `zeta-plugin`). `all`, the default, still enables every plugin,
# so only selections that list plugins individually are affected.
database = ["zeta-plugin/database"]
http = ["zeta-plugin/http"]
native-tls = [
    "zeta-plugin/native-tls",
    "plugins-alert?/native-tls",
    "plugins-chaturbate?/native-tls",
    "plugins-choices?/native-tls",
    "plugins-coinmarketcap?/native-tls",
    "plugins-dendanskeordbog?/native-tls",
    "plugins-dig?/native-tls",
    "plugins-filter?/native-tls",

[package]
name = "plugins"
version = "0.0.0"
rust-version.workspace = true
edition.workspace = true
description = "The bundled plugins for the zeta IRC bot."
license.workspace = true
repository.workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
default = ["all"]
# Shared feature names kept for the host and downstream feature selections. Each plugin crate
# carries its own dependencies, so these mostly preserve the historical feature vocabulary.
# Two historical implications were dropped with the crate split: `ofn` no longer enables
# `youtube` (the URL parser moved to `plugins-shared`) and `unwall` no longer enables `filter`
# (the hostmask matcher moved to `zeta-plugin`). `all`, the default, still enables every plugin,
# so only selections that list plugins individually are affected.
database = ["dep:sqlx", "zeta-plugin/database"]
http = ["zeta-plugin/http"]
native-tls = [
    "zeta-plugin/native-tls",
    "plugins-coinmarketcap?/native-tls",
    "plugins-dendanskeordbog?/native-tls",
    "plugins-kagi?/native-tls",
    "plugins-reddit?/native-tls",
    "plugins-rink?/native-tls",
]
native-tls-vendored = [
    "zeta-plugin/native-tls-vendored",
    "plugins-coinmarketcap?/native-tls-vendored",
    "plugins-dendanskeordbog?/native-tls-vendored",
    "plugins-kagi?/native-tls-vendored",
    "plugins-reddit?/native-tls-vendored",
    "plugins-rink?/native-tls-vendored",
]
rustls = [
    "zeta-plugin/rustls",
    "plugins-coinmarketcap?/rustls",
    "plugins-dendanskeordbog?/rustls",
    "plugins-kagi?/rustls",
    "plugins-reddit?/rustls",
    "plugins-rink?/rustls",
]

alert = ["database", "dep:plugins-alert"]
chaturbate = ["http", "dep:plugins-chaturbate"]
choices = ["dep:plugins-choices"]
coinmarketcap = ["http", "dep:plugins-coinmarketcap"]
dendanskeordbog = ["http", "dep:plugins-dendanskeordbog"]
dig = ["dep:plugins-dig"]
filter = ["database", "dep:plugins-filter"]
gay = ["dep:plugins-gay"]
geoip = ["http", "dep:plugins-geoip"]
github = ["http", "dep:plugins-github"]
health = ["database", "dep:plugins-health", "plugins-health/database"]
help = ["dep:plugins-help"]
howlongtobeat = ["http", "dep:plugins-howlongtobeat"]
imdb = ["http", "dep:plugins-imdb"]
instagram = ["http", "dep:plugins-instagram"]
isitopen = ["http", "dep:plugins-isitopen"]
kagi = ["http", "dep:plugins-kagi"]
notification = ["database", "dep:plugins-notification"]
ofn = ["database", "http", "dep:plugins-ofn"]
openweathermap = ["http", "dep:plugins-openweathermap"]
pornhub = ["http", "dep:plugins-pornhub"]
reddit = ["http", "dep:plugins-reddit"]
rink = ["http", "dep:plugins-rink"]
rust-playground = ["http", "dep:plugins-rust-playground"]
spotify = ["http", "dep:plugins-spotify"]
string-utils = ["dep:plugins-string-utils"]
thingiverse = ["http", "dep:plugins-thingiverse"]
tiktok = ["http", "dep:plugins-tiktok"]
titles = ["http", "dep:plugins-titles"]
trustpilot = ["http", "dep:plugins-trustpilot"]
tvmaze = ["http", "dep:plugins-tvmaze"]
twitch = ["http", "dep:plugins-twitch"]
urban-dictionary = ["http", "dep:plugins-urban-dictionary"]
unwall = ["database", "http", "dep:plugins-unwall"]
youtube = ["http", "dep:plugins-youtube"]
all = [
    "alert",
    "chaturbate",
    "choices",
    "coinmarketcap",
    "dendanskeordbog",
    "dig",
    "filter",
    "gay",
    "geoip",
    "github",
    "health",
    "help",
    "howlongtobeat",
    "imdb",
    "instagram",
    "isitopen",
    "kagi",
    "notification",
    "ofn",
    "openweathermap",
    "pornhub",
    "reddit",
    "rink",
    "rust-playground",
    "spotify",
    "string-utils",
    "thingiverse",
    "tiktok",
    "titles",
    "trustpilot",
    "tvmaze",
    "twitch",
    "urban-dictionary",
    "unwall",
    "youtube",
]

[dependencies]
figment.workspace = true
plugins-alert = { path = "../plugins-alert", default-features = false, optional = true }
plugins-chaturbate = { path = "../plugins-chaturbate", default-features = false, optional = true }
plugins-choices = { path = "../plugins-choices", default-features = false, optional = true }
plugins-coinmarketcap = { path = "../plugins-coinmarketcap", default-features = false, optional = true }
plugins-dendanskeordbog = { path = "../plugins-dendanskeordbog", default-features = false, optional = true }
plugins-dig = { path = "../plugins-dig", default-features = false, optional = true }
plugins-filter = { path = "../plugins-filter", default-features = false, optional = true }
plugins-gay = { path = "../plugins-gay", default-features = false, optional = true }
plugins-geoip = { path = "../plugins-geoip", default-features = false, optional = true }
plugins-github = { path = "../plugins-github", default-features = false, optional = true }
plugins-health = { path = "../plugins-health", default-features = false, optional = true }
plugins-help = { path = "../plugins-help", default-features = false, optional = true }
plugins-howlongtobeat = { path = "../plugins-howlongtobeat", default-features = false, optional = true }
plugins-imdb = { path = "../plugins-imdb", default-features = false, optional = true }
plugins-instagram = { path = "../plugins-instagram", default-features = false, optional = true }
plugins-isitopen = { path = "../plugins-isitopen", default-features = false, optional = true }
plugins-kagi = { path = "../plugins-kagi", default-features = false, optional = true }
plugins-notification = { path = "../plugins-notification", default-features = false, optional = true }
plugins-ofn = { path = "../plugins-ofn", default-features = false, optional = true }
plugins-openweathermap = { path = "../plugins-openweathermap", default-features = false, optional = true }
plugins-pornhub = { path = "../plugins-pornhub", default-features = false, optional = true }
plugins-reddit = { path = "../plugins-reddit", default-features = false, optional = true }
plugins-rink = { path = "../plugins-rink", default-features = false, optional = true }
plugins-rust-playground = { path = "../plugins-rust-playground", default-features = false, optional = true }
plugins-spotify = { path = "../plugins-spotify", default-features = false, optional = true }
plugins-string-utils = { path = "../plugins-string-utils", default-features = false, optional = true }
plugins-thingiverse = { path = "../plugins-thingiverse", default-features = false, optional = true }
plugins-tiktok = { path = "../plugins-tiktok", default-features = false, optional = true }
plugins-titles = { path = "../plugins-titles", default-features = false, optional = true }
plugins-trustpilot = { path = "../plugins-trustpilot", default-features = false, optional = true }
plugins-tvmaze = { path = "../plugins-tvmaze", default-features = false, optional = true }
plugins-twitch = { path = "../plugins-twitch", default-features = false, optional = true }
plugins-unwall = { path = "../plugins-unwall", default-features = false, optional = true }
plugins-urban-dictionary = { path = "../plugins-urban-dictionary", default-features = false, optional = true }
plugins-youtube = { path = "../plugins-youtube", default-features = false, optional = true }
serde.workspace = true
# Embeds `migrations/` for the `database` feature; the host's feature selection supplies the
# database driver and runtime.
sqlx = { version = "0.9.0", default-features = false, features = ["migrate", "macros"], optional = true }
tracing.workspace = true
zeta-plugin = { workspace = true, default-features = false }
zeta-plugin-runtime = { workspace = true }

[dev-dependencies]
plugins-dig = { path = "../plugins-dig" }
serde_json.workspace = true
syn = { version = "=3.0.10", default-features = false, features = ["derive", "full", "parsing"] }
tokio.workspace = true
zeta-test-support = { workspace = true }

[lints]
workspace = true

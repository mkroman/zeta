[package]
name = "plugins-ofn"
version = "0.0.0"
rust-version.workspace = true
edition.workspace = true
description = "The ofn plugin for the zeta IRC bot."
license.workspace = true
repository.workspace = true

[features]
default = []

[dependencies]
clap.workspace = true
num-format = "0.4.4"
plugins-shared = { workspace = true }
sqlx = { version = "0.9.0", default-features = false, features = ["migrate", "macros", "postgres", "chrono", "runtime-tokio"] }
thiserror.workspace = true
tracing.workspace = true
url.workspace = true
zeta-plugin = { workspace = true, default-features = false, features = ["database"] }
zeta-url = { workspace = true }
zeta-utils = { workspace = true, features = ["chrono"] }

[lints]
workspace = true

[package]
name = "plugins-ofn"
version = "0.0.0"
rust-version.workspace = true
edition.workspace = true
description = "The ofn plugin for the zeta IRC bot."
license.workspace = true
repository.workspace = true

[features]
default = []

[dependencies]
clap.workspace = true
plugins-shared = { workspace = true }
sqlx = { workspace = true, features = ["migrate", "macros", "chrono"] }
thiserror.workspace = true
tracing.workspace = true
url.workspace = true
zeta-plugin = { workspace = true, features = ["database"] }
zeta-url = { workspace = true }
zeta-utils = { workspace = true, features = ["chrono"] }

[lints]
workspace = true

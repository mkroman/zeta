[package]
name = "dendanskeordbog"
version = "0.1.0"
edition = "2024"
description = "A client and parser for the Danish Dictionary (Den Danske Ordbog)."
license = "MIT OR Apache-2.0"
repository = "https://github.com/mkroman/zeta"
keywords = ["dictionary", "danish", "scraper", "ordnet", "ddo"]
categories = ["api-bindings", "parser", "text-processing"]

[package.metadata.docs.rs]
all-features = true

[features]
client = ["dep:reqwest", "reqwest/gzip", "dep:tokio"]
default = ["serde", "client", "default-tls"]
# The default TLS backend selection (rustls), convenient for `default-features = false`.
default-tls = ["rustls"]
# TLS backend using rustls with the bundled aws-lc-rs provider and platform verifier roots.
rustls = ["reqwest?/rustls"]
# TLS backend provided by the operating system through native-tls.
native-tls = ["reqwest?/native-tls"]
# Same as `native-tls`, but with a statically vendored OpenSSL.
native-tls-vendored = ["reqwest?/native-tls-vendored"]
# Logging events using `tracing`
log = ["dep:tracing"]
serde = ["dep:serde"]

[dependencies]
reqwest = { workspace = true, optional = true }
scraper = { workspace = true }
serde = { workspace = true, features = ["derive"], optional = true }
thiserror = "2.0.16"
tokio = { workspace = true, optional = true, default-features = false, features = ["rt"] }
tracing = { workspace = true, optional = true }

zeta-url = { path = "../zeta-url" }

[dev-dependencies]
tokio = { workspace = true, features = ["net"] }
zeta-test-support = { path = "../zeta-test-support", default-features = false, features = ["http"] }

[lints]
workspace = true

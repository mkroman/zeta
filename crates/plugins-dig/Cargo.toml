[package]
name = "plugins-dig"
version = "0.0.0"
rust-version.workspace = true
edition.workspace = true
description = "The dig plugin for the zeta IRC bot."
license.workspace = true
repository.workspace = true

[features]
default = []
rustls = ["zeta-plugin/rustls"]
native-tls = ["zeta-plugin/native-tls"]
native-tls-vendored = ["zeta-plugin/native-tls-vendored"]

[dependencies]
clap.workspace = true
hickory-resolver.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
zeta-plugin = { path = "../zeta-plugin", default-features = false }
zeta-utils = { path = "../zeta-utils" }

[dev-dependencies]
zeta-test-support = { path = "../zeta-test-support" }

[lints]
workspace = true

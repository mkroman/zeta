[package]
name = "plugins-trustpilot"
version = "0.0.0"
rust-version.workspace = true
edition.workspace = true
description = "The trustpilot plugin for the zeta IRC bot."
license.workspace = true
repository.workspace = true

[features]
default = []

[dependencies]
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
zeta-http = { workspace = true, features = ["http"] }
zeta-plugin = { workspace = true, features = ["http"] }
zeta-url = { workspace = true }
zeta-utils = { workspace = true }

[dev-dependencies]
serde_json.workspace = true
zeta-test-support = { workspace = true, features = ["context", "http"] }

[lints]
workspace = true

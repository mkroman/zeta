[package]
name = "plugins-notification"
version = "0.0.0"
rust-version.workspace = true
edition.workspace = true
description = "The notification plugin for the zeta IRC bot."
license.workspace = true
repository.workspace = true

[features]
default = []

[dependencies]
serde.workspace = true
sqlx = { version = "0.9.0", default-features = false, features = ["migrate", "macros", "postgres", "chrono", "runtime-tokio"] }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
zeta-plugin = { workspace = true, default-features = false, features = ["database"] }

[dev-dependencies]
zeta-test-support = { workspace = true }

[lints]
workspace = true

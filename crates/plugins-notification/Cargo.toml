[package]
name = "plugins-notification"
version = "0.0.0"
rust-version.workspace = true
edition.workspace = true
description = "The notification plugin for the zeta IRC bot."
license.workspace = true
repository.workspace = true

[features]
default = []

[dependencies]
serde.workspace = true
sqlx = { workspace = true, features = ["migrate", "macros", "chrono"] }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
zeta-plugin = { workspace = true, features = ["database"] }
zeta-utils = { workspace = true }

[dev-dependencies]
zeta-test-support = { workspace = true, features = ["context", "http"] }

[lints]
workspace = true

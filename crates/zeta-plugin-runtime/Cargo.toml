[package]
name = "zeta-plugin-runtime"
version = "0.0.0"
rust-version.workspace = true
edition.workspace = true
description = "Runtime support for hosting zeta plugins."
license.workspace = true
repository.workspace = true

[features]
database = ["zeta-plugin/database"]

[dependencies]
figment.workspace = true
foldhash.workspace = true
futures = "0.3.31"
irc.workspace = true
smallvec.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true
zeta-plugin = { path = "../zeta-plugin", default-features = false }
zeta-url = { path = "../zeta-url" }

[dev-dependencies]
allocation-counter = "=0.8.1"
tracing-subscriber.workspace = true
zeta-test-support = { path = "../zeta-test-support", default-features = false, features = ["context"] }

[lints]
workspace = true

[package]
name = "zeta-plugin-runtime"
version = "0.0.0"
edition = "2024"
description = "Runtime support for hosting zeta plugins."
license = "MIT OR Apache-2.0"
repository = "https://github.com/mkroman/zeta"

[features]
database = ["zeta-plugin/database"]

[dependencies]
figment.workspace = true
foldhash.workspace = true
futures = "0.3.31"
irc.workspace = true
smallvec.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true
zeta-plugin = { path = "../zeta-plugin", default-features = false }
zeta-url = { path = "../zeta-url" }

[dev-dependencies]
allocation-counter = "=0.8.1"
tracing-subscriber.workspace = true
zeta-test-support = { path = "../zeta-test-support", default-features = false, features = ["context"] }
zeta-utils = { path = "../zeta-utils" }

[lints]
workspace = true

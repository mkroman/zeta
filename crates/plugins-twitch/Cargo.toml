[package]
name = "plugins-twitch"
version = "0.0.0"
rust-version.workspace = true
edition.workspace = true
description = "The twitch plugin for the zeta IRC bot."
license.workspace = true
repository.workspace = true

[features]
default = []

[dependencies]
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
url.workspace = true
zeta-http = { workspace = true, features = ["http", "oauth"] }

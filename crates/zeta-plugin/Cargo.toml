[package]
name = "zeta-plugin"
version = "0.0.0"
edition = "2024"
description = "The plugin API for the zeta IRC bot."
license = "MIT OR Apache-2.0"
repository = "https://github.com/mkroman/zeta"

[package.metadata.cargo-machete]
ignored = ["humantime-serde"]

[features]
default = []
# Database-backed plugins: the context carries a connection pool and plugins persist their
# state through repositories.
database = ["dep:sqlx"]
native-tls = ["sqlx?/tls-native-tls"]
native-tls-vendored = ["sqlx?/tls-native-tls"]
rustls = ["sqlx?/tls-rustls-aws-lc-rs"]

[dependencies]
arc-swap.workspace = true
argh.workspace = true
async-trait.workspace = true
figment.workspace = true
humantime-serde.workspace = true
inventory = "0.3.24"
irc.workspace = true
serde.workspace = true
serde_ignored.workspace = true
shlex.workspace = true
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio"], optional = true }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true
zeta-plugin-macros = { path = "../zeta-plugin-macros" }
zeta-utils = { path = "../zeta-utils" }

[dev-dependencies]
zeta-test-support = { path = "../zeta-test-support", default-features = false }

[lints]
workspace = true

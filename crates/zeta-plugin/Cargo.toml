[package]
name = "zeta-plugin"
version = "0.0.0"
edition = "2024"
description = "The plugin API for the zeta IRC bot."
license = "MIT OR Apache-2.0"
repository = "https://github.com/mkroman/zeta"

[features]
default = []
# Database-backed plugins: the context carries a connection pool and plugins persist their
# state through repositories.
database = ["dep:sqlx"]
# The shared HTTP client on the context (and the HTTP configuration it is built from).
http = ["dep:reqwest", "dep:zeta-http"]
native-tls = ["sqlx?/tls-native-tls", "zeta-http?/native-tls"]
native-tls-vendored = ["sqlx?/tls-native-tls", "zeta-http?/native-tls-vendored"]
rustls = ["sqlx?/tls-rustls-aws-lc-rs", "zeta-http?/rustls"]

[dependencies]
arc-swap.workspace = true
async-trait.workspace = true
clap.workspace = true
figment.workspace = true
inventory = "0.3.24"
irc.workspace = true
reqwest = { workspace = true, optional = true }
serde.workspace = true
serde_ignored.workspace = true
shlex.workspace = true
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio"], optional = true }
thiserror.workspace = true
tracing.workspace = true
url.workspace = true
wildmatch.workspace = true
zeta-http = { path = "../zeta-http", default-features = false, features = ["http"], optional = true }
zeta-plugin-macros = { path = "../zeta-plugin-macros" }
zeta-utils = { path = "../zeta-utils" }

[dev-dependencies]
tokio.workspace = true
zeta-test-support = { path = "../zeta-test-support", default-features = false }

[lints]
workspace = true

[package]
name = "zeta-plugin"
version = "0.0.0"
edition = "2024"
description = "The plugin API for the zeta IRC bot."
license = "MIT OR Apache-2.0"
repository = "https://github.com/mkroman/zeta"

[package.metadata.cargo-machete]
ignored = ["humantime-serde"]

[features]
default = []
# Database-backed plugins: the context carries a connection pool and plugins persist their
# state through repositories.
database = ["dep:sqlx"]
# DNS resolution (used by the dig plugin).
dns = ["dep:hickory-resolver"]
native-tls = ["sqlx?/tls-native-tls"]
native-tls-vendored = ["sqlx?/tls-native-tls"]
rustls = ["sqlx?/tls-rustls-aws-lc-rs"]

[dependencies]
argh.workspace = true
async-trait.workspace = true
hickory-resolver = { version = "0.26.2", features = ["tls-aws-lc-rs"], optional = true }
humantime-serde = "1.1.1"
irc.workspace = true
serde.workspace = true
shlex.workspace = true
sqlx = { version = "0.9.0", default-features = false, features = ["migrate", "macros", "postgres", "chrono", "runtime-tokio"], optional = true }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true
zeta-utils = { path = "../zeta-utils" }

[lints]
workspace = true

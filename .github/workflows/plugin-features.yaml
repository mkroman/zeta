name: Plugin Features

on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

permissions:
  contents: read

jobs:
  # Checks every bundled plugin in isolation — `--all-features` unification
  # cannot catch a plugin whose feature table is missing a dependency. The list
  # is the plugins crate's `all` table: the shared infrastructure features
  # (http, database, the TLS backends) are not plugin checks.
  plugin-features:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci-plugin-features
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build each plugins feature in isolation
        run: |
          mapfile -t FEATURES < <(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "plugins") | .features.all[]')

          if [ "${#FEATURES[@]}" -eq 0 ]; then
            echo "::error::no plugins found in the plugins crate"
            exit 1
          fi

          echo "checking ${#FEATURES[@]} plugins"

          status=0
          for feature in "${FEATURES[@]}"; do
            echo "::group::plugins/$feature"
            if ! cargo check -p zeta --no-default-features --features "plugins/$feature,rustls,database"; then
              echo "::error::plugins/$feature does not build in isolation"
              status=1
            fi
            echo "::endgroup::"
          done

          exit "$status"

on:
  workflow_call:
    inputs:
      images:
        required: true
        type: string
      labels:
        required: false
        type: string
      annotations:
        required: false
        type: string
      tags:
        required: false
        type: string
      registry:
        default: ghcr.io
        type: string
      username:
        required: false
        type: string
      push:
        default: false
        type: boolean
      cache-from:
        required: false
        type: string
      cache-to:
        required: false
        type: string
    secrets:
      password:
        required: true
        description: "Password for authentication with the container registry"

    outputs:
      tags:
        description: "Generated Docker tags"
        value: "${{ jobs.build.outputs.tags }}"
      tag-names:
        description: "Generated Docker tag names without image base name"
        value: "${{ jobs.build.outputs.tag-names }}"
      labels:
        description: "Generated Docker labels"
        value: "${{ jobs.build.outputs.labels }}"
      annotations:
        description: "Generated annotations"
        value: "${{ jobs.build.outputs.annotations }}"

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      tags: "${{ steps.meta.outputs.tags }}"
      tag-names: "${{ steps.meta.outputs.tag-names }}"
      labels: "${{ steps.meta.outputs.labels }}"
      annotations: "${{ steps.meta.outputs.annotations }}"
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          # GHCR reads the description from the image index, not the image manifests
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ inputs.images }}
          labels: ${{ inputs.labels }}
          annotations: ${{ inputs.annotations }}
          tags: ${{ inputs.tags }}
      - name: Login to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        # The registry cache backend (`type=registry`) needs registry auth even
        # when the image itself isn't pushed.
        if: inputs.push || inputs.cache-from != '' || inputs.cache-to != ''
        with:
          registry: ${{ inputs.registry }}
          username: ${{ inputs.username || github.actor }}
          password: ${{ secrets.password || secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: ${{ inputs.cache-from }}
          cache-to: ${{ inputs.cache-to }}

name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Cancel superseded runs to free up cache writers
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.rust }})
    strategy:
      fail-fast: true
      matrix:
        rust: [stable, nightly]
    uses: $/.github/workflows/test.yaml
    with:
      toolchain: ${{ matrix.rust }}

  # `fetch-ucd` shells out to curl and manipulates paths and renames, so exercise the
  # dependency-free xtask tests on Windows as well. No database or services are needed.
  xtask_windows:
    name: Test xtask (Windows)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Test xtask
        run: cargo test -p xtask --profile xtask

  # Validates mise.toml/mise.lock on every PR and lints the workflow files.
  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up mise
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: "2026.11.8"
          install_args: "actionlint shellcheck"
      - name: Lint workflows
        run: mise run actionlint

  # Runs in parallel; the container image job only waits for the tests.
  doc:
    name: Rustdoc
    uses: $/.github/workflows/doc.yaml

  # Checks every bundled plugin feature in isolation.
  plugin_features:
    name: Plugin Features
    uses: $/.github/workflows/plugin-features.yaml

  container_image:
    name: Container Image
    needs:
      - test
    uses: $/.github/workflows/container-image.yaml
    with:
      images: ghcr.io/${{ github.repository }}
      push: ${{ github.ref == 'refs/heads/main' }}
      tags: |
        type=edge,branch=main
        type=sha
      # Only main writes the shared cache, else PRs accumulate per-branch caches.
      cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/buildcache
      cache-to: ${{ github.ref == 'refs/heads/main' && format('type=registry,ref=ghcr.io/{0}/buildcache,mode=max', github.repository) || '' }}
    # Job-level permissions replace the workflow-level ones entirely.
    permissions:
      contents: read
      packages: write
    secrets:
      password: ${{ secrets.GITHUB_TOKEN }}

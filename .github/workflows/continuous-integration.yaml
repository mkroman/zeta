name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  RUST_BACKTRACE: short

# Cancel superseded runs to free up cache writers
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Test (${{ matrix.rust }})
    strategy:
      fail-fast: true
      matrix:
        rust: [stable, nightly]
    uses: ./.github/workflows/test.yaml
    with:
      toolchain: ${{ matrix.rust }}

  container_image:
    name: Container Image
    needs:
      - test
    uses: ./.github/workflows/container-image.yaml
    with:
      images: ghcr.io/${{ github.repository }}
      push: ${{ github.ref == 'refs/heads/main' }}
      tags: |
        type=edge,branch=main
        type=sha
      # Only main writes the shared cache: PR caches would accumulate
      # per-branch cache images in the registry.
      cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/buildcache
      cache-to: ${{ github.ref == 'refs/heads/main' && format('type=registry,ref=ghcr.io/{0}/buildcache,mode=max', github.repository) || '' }}
    secrets:
      password: ${{ secrets.GITHUB_TOKEN }}

name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Cancel superseded runs to free up cache writers
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.rust }})
    strategy:
      fail-fast: true
      matrix:
        rust: [stable, nightly]
    uses: $/.github/workflows/test.yaml
    with:
      toolchain: ${{ matrix.rust }}

  # Runs in parallel; the container image job only waits for the tests.
  doc:
    name: Rustdoc
    uses: $/.github/workflows/doc.yaml

  # Checks every bundled plugin feature in isolation.
  plugin_features:
    name: Plugin Features
    uses: $/.github/workflows/plugin-features.yaml

  container_image:
    name: Container Image
    needs:
      - test
    uses: $/.github/workflows/container-image.yaml
    with:
      images: ghcr.io/${{ github.repository }}
      push: ${{ github.ref == 'refs/heads/main' }}
      tags: |
        type=edge,branch=main
        type=sha
      # Only main writes the shared cache, else PRs accumulate per-branch caches.
      cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/buildcache
      cache-to: ${{ github.ref == 'refs/heads/main' && format('type=registry,ref=ghcr.io/{0}/buildcache,mode=max', github.repository) || '' }}
    # Job-level permissions replace the workflow-level ones entirely.
    permissions:
      contents: read
      packages: write
    secrets:
      password: ${{ secrets.GITHUB_TOKEN }}

name: Continuous Integration

on:
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  RUST_BACKTRACE: short

# Cancel superseded runs to free up cache writers
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Test (${{ matrix.rust }})
    strategy:
      fail-fast: true
      matrix:
        rust: [stable, nightly]
    uses: ./.github/workflows/test.yaml
    with:
      toolchain: ${{ matrix.rust }}

  container_image:
    name: Container Image
    needs:
      - test
    uses: ./.github/workflows/container-image.yaml
    with:
      images: ghcr.io/${{ github.repository }}
      push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
      cache-from: |
        type=gha,scope=buildkit-${{ github.ref_name }}
        type=gha,scope=buildkit-main
      cache-to: type=gha,mode=max,scope=buildkit-${{ github.ref_name }}
    secrets:
      password: ${{ secrets.GITHUB_TOKEN }}

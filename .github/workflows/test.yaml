name: Test

on:
  workflow_call:
    inputs:
      args:
        description: "Arguments to pass on to cargo test and cargo clippy"
        default: "--all-features"
        type: string
      cache-on-failure:
        description: "Cache rust build artifacts despite failures"
        default: true
        type: boolean
      fail-fast:
        description: "Fail fast when a rust test fails"
        default: false
        type: boolean
      runner:
        description: "The GitHub runner to use"
        default: "ubuntu-latest"
        type: string
      toolchain:
        description: "Rust toolchain to use. Defaults to `stable`."
        default: "stable"
        type: string

      # The following inputs are ordered after the ones above because their
      # default values depends on them already being declared.
      cache-key:
        description: "Shared cache key"
        default: "ci-${{ inputs.toolchain }}"
        type: string
      clippy-args:
        description: "Arguments to pass on to clippy"
        default: "--all-targets --all-features --no-deps"
        type: string
      test-args:
        description: "Arguments to pass on to cargo test (defaults to `args` if not set)"
        default: "${{ inputs.args }}"
        type: string

permissions:
  contents: read

jobs:
  # Runs the crate's tests — inline unit tests and the tests/ integration tests — against a
  # postgres instance, which the database-backed tests need for #[sqlx::test].
  test:
    name: Tests
    runs-on: ${{ inputs.runner }}
    services:
      # Parity with compose.yaml: the local development database.
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: zeta
        ports:
          - 5432:5432
        # Gate the tests on postgres actually accepting connections.
        options: >-
          --health-cmd "pg_isready -U user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust ${{ inputs.toolchain }}
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ inputs.toolchain }}
      - name: Enable type layout randomization
        run: echo "RUSTFLAGS=${RUSTFLAGS} -Zrandomize-layout" >> "${GITHUB_ENV}"
        if: inputs.toolchain == 'nightly'
      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ${{ inputs.cache-key }}
          cache-on-failure: ${{ inputs.cache-on-failure }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-targets: true
      - name: Run tests
        env:
          TEST_ARGS: ${{ inputs.test-args }}
          FAIL_FAST: ${{ !inputs.fail-fast && '--no-fail-fast' || '' }}
          DATABASE_URL: postgresql://user:changeme@localhost:5432/zeta
        run: cargo test ${TEST_ARGS} ${FAIL_FAST}

  # Clippy runs as its own job because it doesn't play nice and reuse the
  # intermediate artifacts built by `cargo test` anyway.
  clippy:
    name: Clippy Lints
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust ${{ inputs.toolchain }}
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ inputs.toolchain }}
          components: clippy
      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ${{ inputs.cache-key }}
          save-if: false # Don't cache clippy artifacts
      - name: Run Clippy check
        uses: clechasseur/rs-clippy-check@d626afd6670c78ecef6c7872e1c9e1221065d5c5 # v6.1.0
        with:
          args: ${{ inputs.clippy-args }}

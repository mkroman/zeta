name: Test

on:
  workflow_call:
    inputs:
      args:
        description: "Arguments to pass on to cargo test and cargo clippy"
        default: "--all-features"
        type: string
      cache-on-failure:
        description: "Cache rust build artifacts despite failures"
        default: true
        type: boolean
      fail-fast:
        description: "Fail fast when a rust test fails"
        default: false
        type: boolean
      runner:
        description: "The GitHub runner to use"
        default: "ubuntu-latest"
        type: string
      toolchain:
        description: "Rust toolchain to use. Defaults to `stable`."
        default: "stable"
        type: string

      # Ordered after the inputs their defaults depend on.
      cache-key:
        description: "Shared cache key"
        default: "ci-${{ inputs.toolchain }}"
        type: string
      clippy-args:
        description: "Arguments to pass on to clippy"
        default: "--workspace --all-targets --all-features --no-deps"
        type: string
      test-args:
        description: "Arguments to pass on to cargo test (defaults to `args` if not set)"
        default: "${{ inputs.args }}"
        type: string

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  RUST_BACKTRACE: short
  # Debug info is 80-95% of each test binary, and `cargo test` links one per
  # workspace crate. The runner's remaining disk is not enough for the
  # all-features build with it; dropping it keeps the test job off the ceiling.
  CARGO_PROFILE_TEST_DEBUG: 0

permissions:
  contents: read

jobs:
  # Postgres backs the #[sqlx::test] database tests.
  test:
    name: Tests
    runs-on: ${{ inputs.runner }}
    services:
      # Parity with compose.yaml: the local development database.
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: zeta
        ports:
          - 5432:5432
        # Gate the tests on postgres actually accepting connections.
        options: >-
          --health-cmd "pg_isready -U user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust ${{ inputs.toolchain }}
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ inputs.toolchain }}
      - name: Enable type layout randomization
        run: echo "RUSTFLAGS=${RUSTFLAGS} -Zrandomize-layout" >> "${GITHUB_ENV}"
        if: inputs.toolchain == 'nightly'
      - name: Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ${{ inputs.cache-key }}
          cache-on-failure: ${{ inputs.cache-on-failure }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-targets: true
      - name: Run tests
        env:
          TEST_ARGS: ${{ inputs.test-args }}
          FAIL_FAST: ${{ !inputs.fail-fast && '--no-fail-fast' || '' }}
          DATABASE_URL: postgresql://user:changeme@localhost:5432/zeta
        run: cargo test --workspace ${TEST_ARGS} ${FAIL_FAST}

  # Clippy as its own job: it doesn't reuse cargo test's artifacts anyway.
  clippy:
    name: Clippy Lints
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust ${{ inputs.toolchain }}
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ inputs.toolchain }}
          components: clippy
      - name: Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ${{ inputs.cache-key }}
          save-if: false # Don't cache clippy artifacts
      - name: Run Clippy check
        uses: clechasseur/rs-clippy-check@ac75e246ebbd78d106ac9460c668ab7c8044ebe3 # v6.1.1
        with:
          args: ${{ inputs.clippy-args }}

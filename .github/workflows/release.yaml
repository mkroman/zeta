name: Release

on:
  push:
    tags:
      - 0.*

permissions:
  contents: read
  packages: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  RUST_BACKTRACE: short

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    outputs:
      version: "${{ steps.artifact.outputs.version }}"
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - name: Determine crate version
        id: artifact
        run: |-
          VERSION="$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name == "zeta") | .version')"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
      - name: Verify crate version matches git tag
        env:
          ZETA_VERSION: "${{ steps.artifact.outputs.version }}"
        run: |-
          echo "Current git tag: ${GITHUB_REF_NAME}"
          echo "Current crate version: ${ZETA_VERSION}"
          [[ "${ZETA_VERSION}" == "${GITHUB_REF_NAME}" ]] || (echo "Crate and git version mismatch: '" && exit 1)

  test:
    name: Test
    needs:
      - check
    uses: ./.github/workflows/test.yaml

  container_image:
    name: Container Image
    needs:
      - test
    uses: ./.github/workflows/container-image.yaml
    with:
      images: ghcr.io/${{ github.repository }}
      push: true
      tags: |
        type=ref,event=tag
      cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/buildcache
      cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/buildcache,mode=max
    secrets:
      password: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build
    needs:
      - test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, platform: linux, arch: amd64 }
          - { runner: ubuntu-24.04-arm, platform: linux, arch: arm64 }
          - { runner: macos-latest, platform: darwin, arch: aarch64 }
    outputs:
      version: ${{ steps.artifact.outputs.version }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - name: Determine crate version
        id: artifact
        run: |-
          VERSION="$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name == "zeta") | .version')"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
      - name: Install cargo-auditable
        # Note that we're deliberately avoiding reusing the build cache. The
        # tool itself is installed from its checksummed release binary.
        run: bash hack/install-cargo-tool.sh cargo-auditable "${CARGO_HOME:-$HOME/.cargo}/bin"
      - name: Build
        run: cargo auditable build --release
      - name: Archive symbols and strip executable
        run: sh hack/strip-release.sh target/release/zeta
      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: zeta-${{ matrix.platform }}-${{ matrix.arch }}
          path: target/release/zeta${{ matrix.platform == 'windows' && '.exe' || '' }}
      - name: Upload debug symbols
        uses: actions/upload-artifact@v7
        with:
          name: zeta-${{ matrix.platform }}-${{ matrix.arch }}-debug
          path: target/release/zeta.debug

  pre-notification:
    name: Send Pre-Notification
    runs-on: ubuntu-latest
    needs:
      - check
    steps:
      - uses: mkroman/send-irc-notification@main
        with:
          channel: "#uplink"
          network: "irc.rwx.im:6697"
          message: "\x0310> Building Zeta release\x0f ${{ needs.check.outputs.version }} @ https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          token: "${{ secrets.WEBHOOK_TOKEN }}"
          webhook-url: "${{ vars.WEBHOOK_URL }}"

  draft-release:
    name: Create Draft Release
    runs-on: ubuntu-latest
    # Runs once the tests, container images and release builds have all passed,
    # producing a draft release for the maintainer to review and publish.
    needs:
      - check
      - test
      - container_image
      - build
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: zeta-*
          path: artifacts
          merge-multiple: false
      - name: Stage release assets
        # Each artifact holds a single file, but the file names are shared
        # across platforms (`zeta`, `zeta.debug`), so rename them to the
        # artifact names for unique release assets.
        run: |-
          mkdir assets
          for dir in artifacts/zeta-*/; do
            name="$(basename "${dir}")"
            file="$(find "${dir}" -maxdepth 1 -type f | head -1)"
            mv "${file}" "assets/${name}"
          done
      - name: Create draft release
        # `--generate-notes` builds the body from the commits since the last
        # release tag; the title defaults to the tag name. Guarded so that
        # re-runs skip creation and go straight to uploading the assets.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |-
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" \
              --draft \
              --generate-notes \
              --verify-tag
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |-
          gh release upload "${GITHUB_REF_NAME}" \
            assets/* \
            --clobber

  post-notification:
    name: Send Post-Notification
    runs-on: ubuntu-latest
    needs:
      - check
      - draft-release
    steps:
      - uses: mkroman/send-irc-notification@main
        with:
          channel: "#uplink"
          network: "irc.rwx.im:6697"
          message: "\x0310> Zeta version\x0f ${{ needs.check.outputs.version }}\x0310 draft release ready for review.."
          token: "${{ secrets.WEBHOOK_TOKEN }}"
          webhook-url: "${{ vars.WEBHOOK_URL }}"

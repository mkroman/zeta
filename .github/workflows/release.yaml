name: Release

on:
  push:
    tags:
      - 0.*

permissions:
  contents: read
  packages: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  RUST_BACKTRACE: short

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    outputs:
      version: "${{ steps.artifact.outputs.version }}"
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - name: Determine crate version
        id: artifact
        run: |-
          VERSION="$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name == "zeta") | .version')"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
      - name: Verify crate version matches git tag
        env:
          ZETA_VERSION: "${{ steps.artifact.outputs.version }}"
        run: |-
          echo "Current git tag: ${GITHUB_REF_NAME}"
          echo "Current crate version: ${ZETA_VERSION}"
          [[ "${ZETA_VERSION}" == "${GITHUB_REF_NAME}" ]] || (echo "Crate and git version mismatch: '" && exit 1)

  test:
    name: Test
    needs:
      - check
    uses: ./.github/workflows/test.yaml

  container_image:
    name: Container Image
    needs:
      - test
    uses: ./.github/workflows/container-image.yaml
    with:
      images: ghcr.io/${{ github.repository }}
      push: true
      tags: |
        type=edge,branch=main
        type=ref,event=tag
    secrets:
      password: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build
    needs:
      - test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, platform: linux, arch: amd64 }
          - { runner: ubuntu-latest, platform: linux, arch: arm64 }
          - { runner: macos-latest, platform: darwin, arch: aarch64 }
    outputs:
      version: ${{ steps.artifact.outputs.version }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - name: Determine crate version
        id: artifact
        run: |-
          VERSION="$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name == "zeta") | .version')"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
      - name: Install cargo-auditable
        run: cargo install cargo-auditable
        # Note that we're deliberately avoiding reusing the build cache.
      - name: Build
        run: cargo auditable build --release
      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: zeta-${{ matrix.platform }}-${{ matrix.arch }}
          path: target/release/zeta${{ matrix.platform == 'windows' && '.exe' || '' }}

  pre-notification:
    name: Send Pre-Notification
    runs-on: ubuntu-latest
    needs:
      - check
    steps:
      - uses: mkroman/send-irc-notification@main
        with:
          channel: "#uplink"
          network: "irc.rwx.im:6697"
          message: "\x0310> Building Zeta release\x0f ${{ needs.check.outputs.version }} @ https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          token: "${{ secrets.WEBHOOK_TOKEN }}"
          webhook-url: "${{ vars.WEBHOOK_URL }}"

  post-notification:
    name: Send Post-Notification
    runs-on: ubuntu-latest
    needs:
      - check
      - container_image
    steps:
      - uses: mkroman/send-irc-notification@main
        with:
          channel: "#uplink"
          network: "irc.rwx.im:6697"
          message: "\x0310> Zeta version\x0f ${{ needs.check.outputs.version }}\x0310 released.."
          token: "${{ secrets.WEBHOOK_TOKEN }}"
          webhook-url: "${{ vars.WEBHOOK_URL }}"

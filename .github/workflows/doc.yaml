name: Rustdoc

on:
  workflow_call:
    inputs:
      runner:
        description: "The GitHub runner to use"
        default: "ubuntu-latest"
        type: string
      toolchain:
        description: "Rust toolchain to use. Defaults to `stable`."
        default: "stable"
        type: string

      # Ordered after the inputs their defaults depend on.
      cache-key:
        description: "Shared cache key"
        default: "ci-${{ inputs.toolchain }}"
        type: string
      upload:
        description: "Whether to upload the built documentation as an artifact"
        default: true
        type: boolean

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: "-D warnings"

permissions:
  contents: read

jobs:
  doc:
    name: Build
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust ${{ inputs.toolchain }}
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ inputs.toolchain }}
      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ${{ inputs.cache-key }}
          save-if: false # Don't cache rustdoc artifacts
      - name: Build workspace documentation
        run: cargo doc --workspace --no-deps --all-features
      - name: Upload documentation
        if: inputs.upload
        uses: actions/upload-artifact@v7
        with:
          name: rustdoc
          path: target/doc

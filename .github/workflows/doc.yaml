name: Rustdoc

on:
  workflow_call:
    inputs:
      runner:
        description: "The GitHub runner to use"
        default: "ubuntu-latest"
        type: string
      toolchain:
        description: "Rust toolchain to use. Defaults to `stable`."
        default: "stable"
        type: string

      # Ordered after the inputs their defaults depend on.
      cache-key:
        description: "Shared cache key"
        default: "ci-${{ inputs.toolchain }}"
        type: string
      upload:
        description: "Whether to upload the built documentation as an artifact"
        default: true
        type: boolean

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: "-D warnings"

permissions:
  contents: read

jobs:
  doc:
    name: Build
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Rust ${{ inputs.toolchain }}
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ inputs.toolchain }}
      - name: Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ${{ inputs.cache-key }}
          save-if: false # Don't cache rustdoc artifacts
      - name: Build workspace documentation
        run: cargo doc --workspace --no-deps --all-features
      - name: Upload documentation
        if: inputs.upload
        uses: actions/upload-artifact@v7
        with:
          name: rustdoc
          path: target/doc

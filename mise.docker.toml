# Docker build tools.
#
# The Dockerfile copies the digest-pinned official mise binary and runs
# `MISE_ENV=docker mise install --locked`, so cargo-chef and cargo-auditable
# are checksum-verified before they run. Keeping this separate from mise.toml
# means a dev-tool bump does not invalidate the Docker tool layer.
min_version = "2026.10.19"

[settings]
lockfile = true
minimum_release_age = "7d"
use_versions_host = false

[tools]
"github:LukeMathWalker/cargo-chef" = "0.1.78"
"github:rust-secure-code/cargo-auditable" = "0.7.7"

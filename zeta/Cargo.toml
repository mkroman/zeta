[package]
name = "zeta"
version = "0.10.0"
authors = ["Mikkel Kroman <mk@maero.dk>"]
edition = "2024"

[package.metadata.cargo-machete]
ignored = ["humantime-serde"]

[lib]
crate-type = ["lib"]

[[bin]]
name = "zeta"
path = "src/main.rs"

[features]
default = ["plugins-all", "rustls", "database"]
# Browser-emulated HTTP client for anti-bot-protected sites, built on wreq.
emulated = ["dep:wreq", "dep:wreq-util"]
database = ["dep:sqlx", "dep:chrono"]
http = ["dep:reqwest", "dep:serde_path_to_error"]
mirror = [
    "dep:reqwest",
    "reqwest/stream",
    "dep:aws-credential-types",
    "dep:aws-sigv4",
    "dep:aws-smithy-runtime-api",
    "dep:const-hex",
    "dep:sha2",
    "dep:tempfile",
]
native-tls = [
    "reqwest/native-tls",
    "irc/tls-native",
    "sqlx?/tls-native-tls",
    "kagi?/native-tls",
]
native-tls-vendored = [
    "reqwest/native-tls-vendored",
    "irc/tls-native",
    "sqlx?/tls-native-tls",
    "kagi?/native-tls-vendored",
]
rustls = [
    "dep:rustls",
    "reqwest/rustls",
    "irc/tls-rust",
    "sqlx?/tls-rustls-aws-lc-rs",
    "kagi?/rustls",
]
plugin-alert = ["database", "dep:chrono", "dep:interim"]
plugin-chaturbate = ["http", "dep:regex"]
plugin-choices = []
plugin-coinmarketcap = ["http", "dep:strsim"]
plugin-dendanskeordbog = ["http", "dep:dendanskeordbog"]
plugin-dig = []
plugin-filter = ["database", "dep:wildmatch"]
plugin-gay = ["irc/channel-lists", "dep:chrono", "dep:rand_mt", "dep:sha2"]
plugin-geoip = ["http"]
plugin-github = ["http"]
plugin-health = ["dep:memory-stats"]
plugin-help = []
plugin-howlongtobeat = ["http"]
plugin-imdb = ["http", "dep:num-format"]
plugin-instagram = ["mirror", "emulated", "dep:scraper"]
plugin-isitopen = ["http", "dep:regex", "time"]
plugin-kagi = ["dep:kagi"]
plugin-notification = ["database", "dep:chrono"]
plugin-ofn = ["database", "http", "plugin-youtube", "dep:num-format"]
plugin-openweathermap = ["http"]
plugin-pornhub = ["http", "dep:num-format"]
plugin-reddit = ["mirror", "dep:reddit", "dep:secrecy"]
plugin-rink = ["dep:rink-core"]
plugin-rust-playground = ["http", "dep:regex"]
plugin-spotify = ["http", "dep:base64", "dep:indefinite", "dep:num-format", "dep:regex"]
plugin-string-utils = []
plugin-thingiverse = ["http", "dep:num-format", "dep:regex"]
plugin-tiktok = ["mirror", "http"]
plugin-titles = ["emulated", "dep:html5ever"]
plugin-trustpilot = ["http", "dep:num-format"]
plugin-tvmaze = ["http", "time"]
plugin-twitch = ["http", "dep:num-format"]
plugin-urban-dictionary = ["http", "time"]
plugin-youtube = ["http", "dep:htmlize", "dep:indefinite", "dep:num-format", "time"]
plugins-all = [
    "plugin-alert",
    "plugin-chaturbate",
    "plugin-choices",
    "plugin-coinmarketcap",
    "plugin-dendanskeordbog",
    "plugin-dig",
    "plugin-filter",
    "plugin-gay",
    "plugin-geoip",
    "plugin-github",
    "plugin-health",
    "plugin-help",
    "plugin-howlongtobeat",
    "plugin-imdb",
    "plugin-instagram",
    "plugin-isitopen",
    "plugin-kagi",
    "plugin-notification",
    "plugin-ofn",
    "plugin-openweathermap",
    "plugin-pornhub",
    "plugin-reddit",
    "plugin-rink",
    "plugin-rust-playground",
    "plugin-spotify",
    "plugin-string-utils",
    "plugin-thingiverse",
    "plugin-tiktok",
    "plugin-titles",
    "plugin-trustpilot",
    "plugin-tvmaze",
    "plugin-twitch",
    "plugin-urban-dictionary",
    "plugin-youtube",
]

[dependencies]
argh.workspace = true
async-trait.workspace = true
aws-credential-types = { version = "1.3.0", optional = true }
aws-sigv4 = { version = "1.5.2", optional = true }
aws-smithy-runtime-api = { version = "1.16.1", features = ["client"], optional = true }
base64 = { version = "0.23.0", optional = true }
chrono = { version = "0.4.45", optional = true }
const-hex = { version = "1.19", optional = true }
dendanskeordbog = { path = "../dendanskeordbog", features = ["client", "log"], optional = true }
figment = { version = "0.10.19", features = ["toml", "env"] }
futures = "0.3.31"
hickory-resolver = { version = "0.26.2", features = ["tls-aws-lc-rs"] }
html5ever = { version = "0.40.0", optional = true }
htmlize = { version = "1.1.0", features = ["unescape"], optional = true }
humantime-serde = "1.1.1"
indefinite = { version = "0.1.11", optional = true }
interim = { version = "0.2.1", features = ["chrono_0_4"], optional = true }
irc.workspace = true
kagi = { path = "../kagi", default-features = false, optional = true }
memory-stats = { version = "1.2.0", optional = true }
miette = { version = "7.2.0", default-features = false, features = ["derive", "fancy-no-backtrace"] }
num-format = { version = "0.4.4", optional = true }
opentelemetry = { version = "0.32.0", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = [
    "http-proto",
    "reqwest-client",
    "trace",
] }
opentelemetry-resource-detectors = "0.12.0"
opentelemetry-semantic-conventions = "0.32"
opentelemetry_sdk = { version = "0.32.0", default-features = false, features = [
    "experimental_trace_batch_span_processor_with_async_runtime",
    "rt-tokio",
    "trace",
] }
rand = "0.10.1"
rand_mt = { version = "6", optional = true }
reddit = { path = "../reddit", optional = true }
regex = { version = "1.12.2", optional = true }
reqwest = { workspace = true, features = ["json", "cookies", "form", "query", "gzip", "brotli", "deflate", "zstd"], optional = true }
rink-core = { git = "https://codeberg.org/tiffany/rink", rev = "61be392a0d605ea6c4192934134683d63fbe7f7d", features = ["bundle-files", "serde_json"], optional = true }
rustls = { version = "0.23.44", optional = true }
scraper = { version = "0.27.0", optional = true }
secrecy = { optional = true, workspace = true }
serde.workspace = true
serde_ignored = "0.1.2"
serde_json.workspace = true
serde_path_to_error = { workspace = true, optional = true }
sha2 = { version = "0.11", optional = true }
sqlx = { version = "0.9.0", default-features = false, features = ["migrate", "macros", "postgres", "chrono", "runtime-tokio"], optional = true }
strsim = { version = "0.11", optional = true }
tempfile = { workspace = true, optional = true }
thiserror.workspace = true
time = { version = "0.3.43", features = ["formatting", "parsing", "serde"], optional = true }
tokio.workspace = true
tracing.workspace = true
tracing-opentelemetry = { version = "0.33.0", default-features = false }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2.5.8"
wildmatch = { version = "=2.6.1", optional = true }
zeta-plugin = { path = "../zeta-plugin" }

# The `prefix-symbols` feature is only supported on non-Apple targets: btls-sys
# skips prefixing the BoringSSL libraries on macOS but still applies the prefix
# to the generated bindgen bindings, so enabling it there fails the final link
# with undefined `build_script_main_*` symbols.
[target.'cfg(not(target_os = "macos"))'.dependencies]
wreq = { version = "0.16.1", default-features = false, features = ["tokio-rt", "webpki-roots", "prefix-symbols", "stream", "gzip", "brotli", "deflate", "zstd"], optional = true }
wreq-util = { version = "0.2.0", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
wreq = { version = "0.16.1", default-features = false, features = ["tokio-rt", "webpki-roots", "stream", "gzip", "brotli", "deflate", "zstd"], optional = true }
wreq-util = { version = "0.2.0", optional = true }

[dev-dependencies]
similar-asserts = "=2.0.0"
wildmatch = "=2.6.1"
zeta-test-support = { path = "../zeta-test-support" }

[lints.clippy]
# Enable all basic clippy lints
all = "warn"
# Enable pedantic lints for stricter code quality
pedantic = "warn"
# Enable experimental/unstable lints that may have false positives
nursery = "warn"
# Disable cargo-related lints (often too noisy for dependencies)
cargo = "allow"
# Allow for higher complexity since it's not a reliable estimate
cognitive_complexity = "allow"

[lints.rust]
# Completely disallow unsafe code - no unsafe blocks, functions, or traits
unsafe_code = "forbid"
# Require documentation for public items
missing_docs = "warn"
# Enforce modern Rust 2018+ idioms and patterns
rust_2018_idioms = "warn"
# Catch unnecessary casts between identical types
trivial_casts = "warn"
# Catch unnecessary numeric type casts (e.g., u32 as u32)
trivial_numeric_casts = "warn"
# Warn when import braces are used unnecessarily (use foo::{bar} vs use foo::bar)
unused_import_braces = "warn"
# Catch redundant path qualifications (self::foo when foo would suffice)
unused_qualifications = "warn"

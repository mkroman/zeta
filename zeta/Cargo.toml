[package]
name = "zeta"
version = "0.6.5"
authors = ["Mikkel Kroman <mk@maero.dk>"]
edition = "2024"

[package.metadata.cargo-machete]
ignored = ["humantime-serde"]

[lib]
crate-type = ["lib"]

[[bin]]
name = "zeta"
path = "src/main.rs"

[features]
default = ["plugins-all", "native-tls", "database"]
database = ["dep:sqlx", "dep:chrono"]
http = ["dep:reqwest"]
native-tls = ["reqwest/native-tls", "irc/tls-native", "sqlx?/tls-native-tls"]
native-tls-vendored = ["reqwest/native-tls-vendored", "irc/tls-native", "sqlx?/tls-native-tls"]
rustls = ["reqwest/rustls", "irc/tls-rust", "sqlx?/tls-rustls"]
plugin-alert = ["database", "dep:chrono", "dep:interim"]
plugin-chaturbate = ["http", "dep:regex"]
plugin-choices = []
plugin-cryptocoins = ["http", "dep:frizbee", "dep:serde_path_to_error"]
plugin-dendanskeordbog = ["http", "dep:dendanskeordbog"]
plugin-dig = []
plugin-geoip = ["http"]
plugin-github = ["http"]
plugin-google-images = ["http"]
plugin-health = ["dep:memory-stats"]
plugin-howlongtobeat = ["http"]
plugin-imdb = ["http", "dep:num-format", "dep:serde_path_to_error"]
plugin-isitopen = ["http", "dep:regex", "dep:time"]
plugin-kagi = ["http", "dep:regex", "dep:scraper"]
plugin-notification = ["database", "dep:chrono"]
plugin-ofn = ["database", "http", "plugin-youtube", "dep:num-format"]
plugin-openweathermap = ["http"]
plugin-pornhub = ["http", "dep:num-format", "dep:serde_path_to_error"]
plugin-reddit = ["dep:reddit", "dep:secrecy"]
plugin-rink = ["dep:rink-core"]
plugin-rust-playground = ["http", "dep:regex"]
plugin-spotify = ["http", "dep:base64", "dep:num-format", "dep:regex"]
plugin-string-utils = []
plugin-thingiverse = ["http", "dep:num-format", "dep:regex"]
plugin-tiktok = ["http"]
plugin-trustpilot = ["http", "dep:num-format"]
plugin-tvmaze = ["http", "dep:time", "dep:serde_path_to_error"]
plugin-twitch = ["http", "dep:num-format"]
plugin-urban-dictionary = ["http", "dep:time"]
plugin-youtube = [
    "http",
    "dep:htmlize",
    "dep:num-format",
    "dep:serde_path_to_error",
    "dep:time",
]
plugins-all = [
    "plugin-alert",
    "plugin-chaturbate",
    "plugin-choices",
    "plugin-cryptocoins",
    "plugin-dendanskeordbog",
    "plugin-dig",
    "plugin-geoip",
    "plugin-github",
    "plugin-google-images",
    "plugin-health",
    "plugin-howlongtobeat",
    "plugin-imdb",
    "plugin-isitopen",
    "plugin-kagi",
    "plugin-notification",
    "plugin-ofn",
    "plugin-openweathermap",
    "plugin-pornhub",
    "plugin-reddit",
    "plugin-rink",
    "plugin-rust-playground",
    "plugin-spotify",
    "plugin-string-utils",
    "plugin-thingiverse",
    "plugin-tiktok",
    "plugin-trustpilot",
    "plugin-tvmaze",
    "plugin-twitch",
    "plugin-urban-dictionary",
    "plugin-youtube",
]

[dependencies]
argh.workspace = true
async-trait.workspace = true
base64 = { version = "0.23.0", optional = true }
chrono = { version = "0.4.45", optional = true }
dendanskeordbog = { path = "../dendanskeordbog", features = ["client"], optional = true }
figment = { version = "0.10.19", features = ["toml", "env"] }
frizbee = { workspace = true, optional = true }
futures = "0.3.31"
hickory-resolver = { version = "0.26.2", features = ["tls-ring"] }
htmlize = { version = "1.1.0", features = ["unescape"], optional = true }
humantime-serde = "1.1.1"
interim = { version = "0.2.1", features = ["chrono_0_4"], optional = true }
irc.workspace = true
memory-stats = { version = "1.2.0", optional = true }
miette = { version = "7.2.0", features = ["fancy"] }
num-format = { version = "0.4.4", optional = true }
opentelemetry = "0.32.0"
opentelemetry-otlp = "0.32.0"
opentelemetry-resource-detectors = "0.12.0"
opentelemetry_sdk = { version = "0.32.0", features = ["rt-tokio"] }
rand = "0.10.1"
reddit = { path = "../reddit", optional = true }
regex = { version = "1.12.2", optional = true }
reqwest = { workspace = true, features = ["json", "stream", "cookies", "form", "query"], optional = true }
rink-core = { git = "https://codeberg.org/tiffany/rink", rev = "61be392a0d605ea6c4192934134683d63fbe7f7d", features = ["bundle-files", "serde_json"], optional = true }
scraper = { optional = true, workspace = true }
secrecy = { optional = true, workspace = true }
serde.workspace = true
serde_json.workspace = true
serde_path_to_error = { optional = true, workspace = true }
sqlx = { version = "0.9.0", default-features = false, features = ["migrate", "macros", "postgres", "chrono", "runtime-tokio"], optional = true }
thiserror.workspace = true
time = { version = "0.3.43", features = ["formatting", "parsing", "serde"], optional = true }
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
tracing-opentelemetry = { version = "0.33.0" }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2.5.8"
zeta-plugin = { path = "../zeta-plugin" }

[dev-dependencies]
wildmatch = "=2.6.1"

[lints.clippy]
# Enable all basic clippy lints
all = "warn"
# Enable pedantic lints for stricter code quality
pedantic = "warn"
# Enable experimental/unstable lints that may have false positives
nursery = "warn"
# Disable cargo-related lints (often too noisy for dependencies)
cargo = "allow"
# Disable markdown formatting enforcement in doc comments
doc_markdown = "allow"
# Allow for higher complexity since it's not a reliable estimate
cognitive_complexity = "allow"

[lints.rust]
# Completely disallow unsafe code - no unsafe blocks, functions, or traits
unsafe_code = "forbid"
# Require documentation for public items
missing_docs = "warn"
# Enforce modern Rust 2018+ idioms and patterns
rust_2018_idioms = "warn"
# Catch unnecessary casts between identical types
trivial_casts = "warn"
# Catch unnecessary numeric type casts (e.g., u32 as u32)
trivial_numeric_casts = "warn"
# Warn when import braces are used unnecessarily (use foo::{bar} vs use foo::bar)
unused_import_braces = "warn"
# Catch redundant path qualifications (self::foo when foo would suffice)
unused_qualifications = "warn"

# Database Configuration.
[database]
# PostgreSQL connection string.
url = "postgresql://user:changeme@localhost/zeta_development"

# The maximum idle duration for individual connections.
idle_timeout = "30s"

# The maximum number of connections that the database pool should maintain.
max_connections = 5

# IRC Configuration.
[irc]
# The client's nickname.
nickname = "zeta[dev]"

# Alternative nicknames for the client, if the default is taken.
alt_nicks = ["zet4", "z3ta", "z3t4", "zet_"]

# The client's username.
# username = "zeta"

# The client's real name.
# realname = "Zeta"

# The password to connect to the server.
# password = "password"

# The hostname of the server to connect to.
hostname = "irc.rwx.im"

# The port number of the server to connect to.
port = 6667

# Whether the client should use NickServ GHOST to reclaim its primary nickname if it is in use.
# This has no effect if `nick_password` is not set.
# should_ghost = true

# TLS Configuration.
[irc.tls]
# Toggle the use of TLS.
enabled = true

# List of channels to join. Can be specified multiple times.
[[irc.channels]]
# The name of the channel.
name = "#zeta.dev"
# The key to the channel if it's password protected.
# key = "test"

# [[irc.channels]]
# name = "#otherchannel"
# …

# DNS Configuration.
[dns]
# The number of retries after lookup failure before giving up.
# attempts = 2

# The size in number of records the cache can hold.
# cache_size = 32

# HTTP Configuration.
[http]
# The duration before an HTTP request times out.
# timeout = "30s"

# The `User-Agent` header sent with HTTP requests.
# user_agent = "Mozilla/5.0 (X11; Linux x86_64; rv:155.0) Gecko/20100101 Firefox/155.0"

# Plugin Configuration.
#
# Every plugin has a section keyed by its name, with an `enabled` toggle that
# defaults to true. Plugin-specific settings are type-checked at startup;
# malformed values abort startup with a diagnostic pointing at the key.
# Sections for plugins that are not compiled in are reported as possible typos.
[plugins]
  # Time-based user alerts.
  [plugins.alert]
  # Enable the plugin.
  enabled = true

  # Chaturbate platform integration.
  [plugins.chaturbate]
  # Enable the plugin.
  enabled = true

  # Plugin that helps the user make a choice.
  [plugins.choices]
  # Enable the plugin.
  enabled = true

  # Crypto currency quotes via CoinMarketCap.
  [plugins.coinmarketcap]
  # Enable the plugin.
  enabled = true
  # The CoinMarketCap API key. Falls back to the `COINMARKETCAP_API_KEY`
  # environment variable when unset.
  # api_key = "..."
  # The fiat currency used when a command does not specify one.
  # default_currency = "USD"
  # How long the cached coins and fiat currencies stay valid before being
  # refreshed.
  # cache_ttl = "24h"
  # The maximum number of typos allowed when fuzzy matching a coin name.
  # max_name_typos = 2

  # Query the danish dictionary.
  [plugins.dendanskeordbog]
  # Enable the plugin.
  enabled = true

  # Query nameservers.
  [plugins.dig]
  # Enable the plugin.
  enabled = true
  # Nameservers to query over UDP and TCP.
  # Defaults to Cloudflare's public resolvers (including IPv6).
  nameservers = ["1.1.1.1", "1.0.0.1"]

  # Normative affective resonance profiling, calendar-scoped.
  [plugins.gay]
  # Enable the plugin.
  enabled = true

  # Query geolocation of addresses and hostnames.
  [plugins.geoip]
  # Enable the plugin.
  enabled = true

  # GitHub integration.
  [plugins.github]
  # Enable the plugin.
  enabled = true

  # Process health information.
  [plugins.health]
  # Enable the plugin.
  enabled = true

  # List loaded plugins and their commands.
  [plugins.help]
  # Enable the plugin.
  enabled = true

  # Howlongtobeat.com integration.
  [plugins.howlongtobeat]
  # Enable the plugin.
  enabled = true

  # IMDb integration.
  [plugins.imdb]
  # Enable the plugin.
  enabled = true
  # Whether to include adult titles in search results.
  # include_adult = true
  # The country the IMDb API localises results for.
  # user_country = "US"
  # The language the IMDb API localises results for.
  # user_language = "en-US"

  # Is it open.
  [plugins.isitopen]
  # Enable the plugin.
  enabled = true

  # Kagi search integration.
  [plugins.kagi]
  # Enable the plugin.
  enabled = true

  # User notifications.
  [plugins.notification]
  # Enable the plugin.
  enabled = true

  # URL history.
  [plugins.ofn]
  # Enable the plugin.
  enabled = true

  # Weather service integration.
  [plugins.openweathermap]
  # Enable the plugin.
  enabled = true

  # PornHub platform integration.
  [plugins.pornhub]
  # Enable the plugin.
  enabled = true

  # Reddit plugin integration.
  [plugins.reddit]
  # Enable the plugin.
  enabled = true

  # Calculator plugin based on rink.
  [plugins.rink]
  # Enable the plugin.
  enabled = true

  # Rust Playground integration.
  [plugins.rust_playground]
  # Enable the plugin.
  enabled = true

  # Spotify integration.
  [plugins.spotify]
  # Enable the plugin.
  enabled = true

  # Generic string utility plugin.
  [plugins.string_utils]
  # Enable the plugin.
  enabled = true

  # Thingiverse integration.
  [plugins.thingiverse]
  # Enable the plugin.
  enabled = true

  # TikTok integration.
  [plugins.tiktok]
  # Enable the plugin.
  enabled = true

  # URL titles and OpenGraph metadata.
  [plugins.titles]
  # Enable the plugin.
  enabled = true

  # Trustpilot integration.
  [plugins.trustpilot]
  # Enable the plugin.
  enabled = true

  # TVmaze integration.
  [plugins.tvmaze]
  # Enable the plugin.
  enabled = true

  # Twitch integration.
  [plugins.twitch]
  # Enable the plugin.
  enabled = true

  # Urban Dictionary integration.
  [plugins.urban_dictionary]
  # Enable the plugin.
  enabled = true

  # YouTube integration.
  [plugins.youtube]
  # Enable the plugin.
  enabled = true
  # The YouTube Data API v3 key. Falls back to the `YOUTUBE_API_KEY`
  # environment variable when unset.
  # api_key = "..."
  # The region code used when fetching video categories.
  # region_code = "US"
  # The safe search filter applied to search requests:
  # "none", "moderate" or "strict".
  # safe_search = "none"

# Tracing Configuration.
[tracing]
# Toggle tracing
enabled = true

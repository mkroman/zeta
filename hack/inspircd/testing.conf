# InspIRCd configuration overrides for local development and testing.
#
# This file is mounted into the ircd container at /inspircd/conf.d/ (see compose.yaml) and is
# automatically included by the image's generated configuration — see "Generic configuration
# includes" at https://hub.docker.com/r/inspircd/inspircd-docker/. It relaxes the connection
# limits that would otherwise interfere with running the bot and test clients against the local
# server: clone limits, fake lag, command throttling, connection flooding, and connectban
# Z-lines.
#
# Because the configuration is (re)generated and included on every start, changes to this file
# are picked up with `docker compose restart ircd`.
#
# Written against the InspIRCd v4 configuration documentation:
# https://docs.inspircd.org/4/configuration/ (+ the connectban and connflood module pages).

# A permissive connect class. It is included ahead of the image's own <connect> block, so
# connecting users are assigned to this class.
<connect name="testing"
         allow="*"
         pingfreq="2m"
         timeout="1m"
         threshold="10000"
         commandrate="100000"
         fakelag="off"
         localmax="0"
         globalmax="0"
         limit="10000"
         maxconnwarn="no"
         resolvehostnames="no"
         useident="no"
         usednsbl="no"
         useconnectban="no"
         useconnflood="no">

# Belt and braces: also raise the module-level thresholds, in case a user ends up in a class
# that does not opt out of these modules.
<connectban threshold="100000"
            banduration="1s"
            ipv4cidr="32"
            ipv6cidr="128">

<connflood maxconns="1000"
           period="1s"
           timeout="1s">
